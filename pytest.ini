[pytest]
testpaths = tests
pythonpath = .
# plain `pytest` runs the CPU tests; `pytest -m gpu` runs the ones that need a GPU
# the ROS 2 pytest plugins are on sys.path in a sourced ROS shell and fail to import there
addopts = -m "not gpu" -p no:launch_testing -p no:launch_ros
markers =
    gpu: needs a GPU; run with `pytest -m gpu`

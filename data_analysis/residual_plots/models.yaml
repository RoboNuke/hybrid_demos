# The diffusion-policy bases and their demo datasets, for data_analysis/demo_residual_analysis.ipynb's cell 2: copy an
# entry's task_name, dataset, model_run and model_checkpoint into TASK_NAME, DATASET, MODEL_RUN and MODEL_CHECKPOINT
# (paths are relative to the repo root: DATASET = REPO / "<dataset>", MODEL_RUN = REPO / "<model_run>").
#
#   status             finished / training / queued (a training base's checkpoint is its best so far)
#   base_success_rate  the base's best rollout success during BC training (50 episodes), the checkpoint's
#   env                the task id; action_dim the action's width (ACTION_NAMES, ACTION_COLOURS, ACTION_SCALE and
#                      ACTION_UNITS need one entry per dimension)
#   action_names       ACTION_NAMES, one per action column in order (action_names_euler: after rot6d_columns' conversion)
#                      robomimic OSC_POSE: deltas, 1 unit = 50 mm / 0.5 rad (x 50 for mm, x 0.5 * 180 / pi for deg),
#                        gripper -1 open, +1 closed
#                      dexmg_boxcleanup: each Panda's OSC_POSE delta in its own base frame (1 unit = 50 mm / 0.5 rad),
#                        then its Inspire hand; right robot first
#                      dexmg_coffee / dexmg_cansort: whole-body Mink IK, each hand's absolute world target (position m,
#                        rotation axis-angle rad), right then left, then the right hand's fingers, then the left's
#                      the hands' six inputs (robosuite's format_action): pinky, ring, middle, index, thumb bend
#                        (its 2-3 joints together), thumb rotation
#   action_scale       ACTION_SCALE, plot units per action unit, one per column (_euler: after rot6d_columns' conversion)
#   action_units       ACTION_UNITS, the plot unit of each column (_euler: after rot6d_columns' conversion)
#   bc_config          the config the base was trained with
#   wandb_run          the BC run on wandb
#   phases             FurnitureBench only: PHASES, the phase ids kept (2 insert, 3 screw); null every frame. A phase
#                      entry's figures get "_phase<ids>" after the dataset's name, so they never overwrite the full task's
#   rot6d_columns      ROT6D_COLUMNS, the action's rot6d columns converted to roll, pitch, yaw; null none
#   relative_to_ee     RELATIVE_TO_EE: the base and executed actions taken relative to the robot's current state, read
#                      from the observation (the residual = executed - base keeps its meaning); null: as they are.
#                      poses: per hand, its target position - the hand's position (world axes); its target rotation
#                      R_target R_hand^T (world axes), R_hand the observed rotation times obs_rot_offset (the observed
#                      frame -> the target's frame), given back in the action's own parametrisation (rotvec: axis-angle;
#                      rot6d: left for rot6d_columns, which turns it into roll, pitch, yaw). fingers: the finger command
#                      columns (each a position servo's target angle, rad), as the change in target: the command - the
#                      target the servo holds (the previous step's executed command; 0 at an episode's first step,
#                      robosuite's initial gripper goal)
#                      GR1 (coffee, cansort): obs_rot_offset is the fixed eef_quat -> grip_site rotation, measured in
#                      the sim; boxcleanup's arms are OSC deltas already, so only its fingers
#   action_names       ACTION_NAMES, one per action column in order (action_names_euler: after rot6d_columns' conversion)
#                      robomimic OSC_POSE: deltas, 1 unit = 50 mm / 0.5 rad (x 50 for mm, x 0.5 * 180 / pi for deg),
#                        gripper -1 open, +1 closed
#                      dexmg_boxcleanup: each Panda's OSC_POSE delta in its own base frame (1 unit = 50 mm / 0.5 rad),
#                        then its Inspire hand; right robot first
#                      dexmg_coffee / dexmg_cansort: whole-body Mink IK, each hand's absolute world target (position m,
#                        rotation axis-angle rad), right then left, then the right hand's fingers, then the left's
#                      the hands' six inputs (robosuite's format_action): pinky, ring, middle, index, thumb bend
#                        (its 2-3 joints together), thumb rotation
#   action_scale       ACTION_SCALE, plot units per action unit, one per column (_euler: after rot6d_columns' conversion)
#   action_units       ACTION_UNITS, the plot unit of each column (_euler: after rot6d_columns' conversion)
#   bc_config          the config the base was trained with
#   wandb_run          the BC run on wandb
#   phases             FurnitureBench only: PHASES, the phase ids kept (2 insert, 3 screw); null every frame. A phase
#                      entry's figures get "_phase<ids>" after the dataset's name, so they never overwrite the full task's
#   rot6d_columns      ROT6D_COLUMNS, the action's rot6d columns converted to roll, pitch, yaw; null none
#   relative_to_ee     RELATIVE_TO_EE: the base and executed actions taken relative to the EE's current pose, read from
#                      the observation -- position: target - EE position (world axes); rotation (with rot6d_columns):
#                      roll, pitch, yaw of R_target R_ee^T (world axes). action_pos the action's position columns,
#                      obs_pos / obs_rot (rot6d) the EE's in the observation; null: the actions as they are (absolute)

robomimic_can:
  task_name: robomimic_can
  dataset: data/robomimic_can_mh_300
  model_run: runs/robomimic_can/bc_resfit_can/bc_resfit_can_a0
  model_checkpoint: actor_chkpt_best_success_rate.pt
  phases: null
  rot6d_columns: null
  relative_to_ee: null
  status: finished
  base_success_rate: 0.80
  env: Robosuite-Can-LowDim-v0
  action_dim: 7
  action_names: [x, y, z, rx, ry, rz, gripper]
  action_scale: [50.0, 50.0, 50.0, 28.64788975654116, 28.64788975654116, 28.64788975654116, 1.0]
  action_units: [mm, mm, mm, deg, deg, deg, unit]
  bc_config: configs/experiments/resfit_can/bc_resfit_can.yaml
  wandb_run: hur/resfit_validation/asz6ed2w


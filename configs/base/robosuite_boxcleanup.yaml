# DexMimicGen BoxCleanup (TwoArmBoxCleanup, two Pandas with dexterous hands, BASIC OSC_POSE arms): 20 Hz,
# 300-step episodes; low-dim observation (both robots' state 38, then the scene's joint positions 14). As ResFiT's code builds it (my_project/tasks/robosuite_tasks.py); sparse reward, the episode ended on
# success. Everything here is the task's defaults.
base: hpc.yaml

task:
  name: Robosuite-BoxCleanup-LowDim-v0
  # MuJoCo simulates it: the entry points never start Isaac Sim
  simulator: standalone

wrappers:
  task_metrics:
    enabled: false

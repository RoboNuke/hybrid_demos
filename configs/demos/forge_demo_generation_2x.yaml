# The scripted expert at double speed: every speed limit doubled, plus the two settings that
# cap real speed through Forge's action smoothing (~4-step lag): the leash (free-space speed
# ~ leash / 4 steps) and the insertion push (insertion speed ~ insert_push_depth / 4 steps).
# The sliding push stays at 3 mm: doubled, friction stops the slide 2-3 mm short of the hole.
#
#   python scripts/record_demos.py --config configs/demos/forge_demo_generation_2x.yaml --headless \
#       record.dataset_dir=data/expert_demos_forge_pih_2x record.num_episodes=50
base: forge_demo_generation.yaml

record:
  max_speed_pos: 0.06
  max_speed_yaw: 1.0
  leash_pos: 0.02
  leash_yaw: 0.3
  expert:
    descend_speed: 0.04
    slide_speed: 0.02
    insert_push_depth: 0.006

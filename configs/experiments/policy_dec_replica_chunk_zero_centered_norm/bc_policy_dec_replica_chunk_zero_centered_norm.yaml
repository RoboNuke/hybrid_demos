# BC: resip_replica/bc_resip_replica.yaml (ResiP's U-Net on the 50 scripted demos, the setup
# physic_aligned_evalHappy_a0 trained with) with the network predicting every step of its chunk in the
# EE frame of its observation, [dpos (m), drot (axis-angle, rad), gripper], each dim scaled to [-1, 1] by
# max(|min|, |max|) of its labels (zero-centred: zero is the observation's pose) and clipped there as the
# reference clips; the same model, demos, observation and env (the absolute action), 150k gradient steps.
# Train:
#   python scripts/train_bc.py --config configs/experiments/policy_dec_replica_chunk_zero_centered_norm/bc_policy_dec_replica_chunk_zero_centered_norm.yaml --headless
base: _foundation.yaml

wandb:
  project: hybrid_demo_furniture
  group: bc_policy_dec_replica_chunk_zero_centered_norm

task:
  cfg:
    scene:
      # one round of eval.num_rollouts rollouts
      num_envs: 512

trainer:
  learner: diffusion_bc
  # gradient steps
  total_timesteps: 150000
  checkpoint_interval: 50000

hpc:
  # the HPC launchers run this entry script (BC has its own; the package's runs sac / ppo)
  train_script: scripts/train_bc.py

model:
  architecture: diffusion_unet
  actor:
    horizon: 32
    n_obs_steps: 1
    action_horizon: 8
    down_dims: [256, 512, 1024]
    diffusion_step_embed_dim: 256
    kernel_size: 5
    n_groups: 8
    num_diffusion_iters: 100
    # DDIM steps in the rollouts (their checkpoint's actor)
    inference_steps: 16
    # each chunk starts from the previous chunk's unexecuted tail (robust-rearrangement)
    warm_start: true
    # every step of the chunk relative to the EE pose at the observation (my_project/models/action_frame.py)
    action_frame: ee_at_obs

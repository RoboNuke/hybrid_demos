# can_adaptive_cal with the actor's r range widened from [-0.1, 0.1] to [-1, 1]: the correction up to 1.1 controller
# units per dim (the controller clips the sent action to [-1, 1], scaled's limit), exploration unchanged.
# Adaptive, calibrated per dim: the acting noise (warm-up and exploration) is times the base action in r units per dim
# (|b| / s), with each dim's scale can_add's divided by that dim's demo mean of |b| / s (m below), so every dim explores
# as much as can_add's on average -- more where the base moves more than its usual, less where it moves less (not capped
# at can_add's). The target smoothing is can_add's (not adaptive).
#   m = mean over the 61548 can demo frames of |b_d| / s_d = [0.1679, 0.3121, 0.1812, 0.0332, 0.0324, 0.0834, 0.9031]
# 200k env steps.
base: _foundation.yaml

wandb:
  group: can_adaptive_cal_wide_v2

trainer:
  total_timesteps: 200000

additive_residual:
  enabled: true

ddpg:
  action_range:
    - -1.0
    - 1.0
  warmup_noise:
    # 0.2 / m
    scale: [1.1909, 0.6408, 1.1036, 6.0211, 6.1759, 2.3971, 0.2215]
    adaptive: true
    target_scale: 0.05
    target_adaptive: false
  train_noise:
    # 0.05 / m
    scale: [0.2977, 0.1602, 0.2759, 1.5053, 1.544, 0.5993, 0.0554]
    adaptive: true
    target_scale: 0.05
    target_adaptive: false

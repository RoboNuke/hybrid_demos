# can_adaptive_cal.yaml rerun to 200k env steps (only the group and the length differ).
# Adaptive, calibrated per dim (residual_noise linear, a0 0): the acting noise's std (warm-up: uniform half width) in the
# sent action is a1 x |b| per dim, a1 = can_add's 0.05 divided by that dim's demo mean of |b| / s (m below), so every dim explores
# as much as can_add's on average -- more where the base moves more than its usual, less where it moves less (not capped
# at can_add's). The target smoothing is can_add's (not adaptive).
#   m = mean over the 61548 can demo frames of |b_d| / s_d = [0.1679, 0.3121, 0.1812, 0.0332, 0.0324, 0.0834, 0.9031]
base: _foundation.yaml

wandb:
  group: can_adaptive_cal_200k_v2

trainer:
  total_timesteps: 200000

additive_residual:
  enabled: true

# the acting noise in the sent action: 0.05 / m x |b| (exploration), 0.2 / m x |b| (the warm-up's uniform half width)
residual_noise:
  mode: linear
  linear:
    # 0.05 / m
    a1: [0.2977, 0.1602, 0.2759, 1.5053, 1.544, 0.5993, 0.0554]
  # 0.2 / m = 4 x 0.05 / m
  warmup_scale: 4.0

ddpg:
  warmup_noise:
    scale: registered
    target_scale: 0.05
  train_noise:
    scale: registered
    target_scale: 0.05

# Scaled: sent = r * base on all 7 dims of the OSC delta (the gripper too, as the additive runs correct it), r the
# multiplier in [-1, 3] starting at 1 (the actor's output bias 0 is the range's midpoint); can_add's noise scales in
# multiplier units: exploration N(0, 0.05), a uniform +-0.2 warm-up around 1, target smoothing 0.05 in both phases.
#   python scripts/train.py --config configs/experiments/can_compare/can_scaled.yaml --headless
#   python scripts/watch_residual_eval.py --headless --run runs/init_explore_residual/can_scaled_v2/can_scaled_v2_a<i> \
#     --eval_config configs/eval/residual_watch_robosuite_rounds.yaml
base: _foundation.yaml

wandb:
  group: can_scaled_v2

multiply_residual:
  enabled: true
  # a demo's base command under 0.01 controller units on a dim (0.5 mm, 0.3 deg) gives no ratio (the multiplier 1)
  invert_floor:
    - 0.01

ddpg:
  action_range:
    - -1.0
    - 3.0
  warmup_noise:
    scale: 0.2
    target_scale: 0.05
  train_noise:
    scale: 0.05

model:
  actor:
    output_bias: 0.0

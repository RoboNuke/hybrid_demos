# physic_aligned: diffusion-policy BC on 50 scripted demos collected in the physics aligned with
# FurnitureSim / ResiP's sim, trained with ResiP's released one_leg recipe (its checkpoint's own config).
#
# The physics are the ResiP task's defaults (Robonuke_Furniture_Bench, since 2026-10-20) plus the top's
# SDF at 1024: FurnitureBench's own meshes (one SDF per part, the top's at 1024), the masses FurnitureSim
# simulates, ResiP's effort-mode gripper (+-13 N, 57 mm/s, no self-collisions), friction 1.0 on the
# obstacles and the robot, the EE velocity at the EE point, FurnitureBench's low reset (parts +-1.5 cm /
# +-15 deg in the tag frame, collision-free, inside the position limits; the arm and obstacles fixed).
#
# The recipe (robust-rearrangement's checkpoint config): batch 1024, lr 1e-4, weight decay 1e-6, cosine
# schedule with 2000 warmup steps, per-dim min-max scaling, rollouts once the test loss is under 0.1,
# 512 of them per evaluation, warm start, 16 DDIM steps. Rollout episodes 1000 steps (our scripted demos
# run 650 steps median, 900 at p90; ResiP's 700-step cap is 1.5x their 460).
#
# Everything named by this run carries "physic_aligned": the demo folder, the dataset, the wandb group
# (runs physic_aligned_a0, ...).
#
#   # a) demos (Robonuke_Furniture_Bench; 64 attempts per round, the expert as pivot_vary_dart's)
#   python scripts/collect_scripted.py --sim resip --screw_pivot --vary --dart_prob 0.05 \
#       --part_assets furniturebench_top1024 --num_envs 64 --num_demos 50 --timeout 1000 --seed 1020 \
#       --out_dir datasets/physic_aligned --save_failure --headless
#   # b) dataset (here)
#   python scripts/import_furniture_demos.py --src ~/Robonuke_Furniture_Bench/datasets/physic_aligned \
#       --out data/physic_aligned --control_hz 10 --task_name Isaac-Furniture-OneLeg-FBAbs-ResiP-v0
#   # c) training (here)
#   python scripts/train_bc.py --config configs/experiments/physic_aligned.yaml --headless
base: deep_resipi_replica.yaml

wandb:
  group: physic_aligned

task:
  cfg:
    # 1000 control steps per rollout episode at 10 Hz
    episode_length_s: 100.0
    scene:
      # one round of eval.num_rollouts rollouts (drop both to 256 if the GPU runs out)
      num_envs: 512
    furniture:
      # FurnitureBench's meshes with the top's SDF at 1024 (the rest of the physics is the task's default)
      part_assets: furniturebench_top1024

model:
  actor:
    # ResiP's actor: every chunk warm-starts from the previous one's tail (their eval as well)
    warm_start: true
    # DDIM steps in the training rollouts (their checkpoint's actor; their evaluate_model.py uses 4)
    inference_steps: 16

bc:
  dataset: data/physic_aligned
  num_demos: 50
  normalization: per_dim
  batch_size: 1024
  lr: 1.0e-4
  weight_decay: 1.0e-6
  lr_schedule: cosine
  warmup_steps: 2000
  # rollouts every 10 epochs (10k gradient steps), once the test loss is under ResiP's 0.1
  rollout_every: 10
  rollout_loss_threshold: 0.1

eval:
  num_rollouts: 512

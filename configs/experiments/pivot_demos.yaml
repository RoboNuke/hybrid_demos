# pivot_demos: deep_resipi_replica on 50 scripted demos collected with the screw pivot
# (Robonuke_Furniture_Bench collect_scripted.py --screw_pivot, no --pivot_dz) -- the only
# change, plus rollouts without warm start and 700 steps long. Those demos replay ~87% open loop (13/15 in the first check), vs ~30% for the
# demos in data/deep_resipi_replica.
#
#   python scripts/import_furniture_demos.py --src /tmp/pivot/screw_pivot_base --out data/pivot_demos \
#       --control_hz 10 --task_name Isaac-Furniture-OneLeg-FBAbs-ResiP-v0
#   python scripts/train_bc.py --config configs/experiments/pivot_demos.yaml --headless
base: deep_resipi_replica.yaml

wandb:
  group: pivot_demos

task:
  cfg:
    # 700 control steps per rollout episode at 10 Hz (deep_resipi_replica: 1000)
    episode_length_s: 70.0

model:
  actor:
    # rollouts: each chunk starts from fresh noise (deep_resipi_replica warm starts)
    warm_start: false
    # DDIM steps at inference (as deep_resipi_replica)
    inference_steps: 4

bc:
  dataset: data/pivot_demos

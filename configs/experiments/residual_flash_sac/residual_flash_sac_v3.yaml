# residual_flash_sac v3: v2 (the actor's mean head at orthogonal gain 0.01, out of weight normalization) with a constant
# std of 0.15 for every state and action dim (no std head, no parameter: resip_ppo_replica's kind of fixed
# exploration, at FlashSAC's entropy-target sigma). In v2 the learned std climbed from 0.15 to ~0.85 within ~1000
# actor updates -- the entropy term's push, at Adam's full step size, with no counter-gradient from a still-flat
# critic -- and the residual's executed corrections were back to v1's ~13 mm / 4.7 deg.
#   python scripts/train.py --config configs/experiments/residual_flash_sac/residual_flash_sac_v3.yaml --headless
base: _foundation.yaml

wandb:
  group: residual_flash_sac_v3

task:
  cfg:
    scene:
      num_envs: 1024

# resip_ppo_replica's run length and checkpoint interval (published every 1000 steps, the default, as that run)
trainer:
  learner: sac
  total_timesteps: 100100
  checkpoint_interval: 3500

residual:
  enabled: true

# FlashSAC's network (models/flashsac.py; its Table 9 sizes): BatchNorm inverted-residual blocks, an actor of 2
# blocks of 128 with a tanh-squashed Gaussian, critics of 2 blocks of 256; the actor's mean head started for a
# residual, its std fixed
model:
  architecture: flashsac
  actor:
    hidden_size: 128
    num_blocks: 2
    mean_init_scale: 0.01
    fixed_std: 0.15
  critic:
    hidden_size: 256
    num_blocks: 2

# residual_flash_sac v11: v10 (the mean head at gain 0.01; a fixed std of exp(-1); no entropy term; no noise
# repetition; data only for 700 steps, the critics from 700, the actor from 2100) with the reward carried back faster:
# 50-step returns (the foundation: 1) and the target critics following 5x faster (Polyak 0.05; the foundation: 0.01).
# In v8 / v10 the critics' Q rose only within ~25-55 steps of a success by step 2100 (1-step TD at Polyak 0.01 moves
# value back about one step per 100 critic updates), so the actor followed noise on the rest of the episode.
#   python scripts/train.py --config configs/experiments/residual_flash_sac/residual_flash_sac_v11.yaml --headless
base: _foundation.yaml

wandb:
  group: residual_flash_sac_v11

task:
  cfg:
    scene:
      num_envs: 1024

# resip_ppo_replica's run length and checkpoint interval (published every 1000 steps, the default, as that run)
trainer:
  learner: sac
  total_timesteps: 100100
  checkpoint_interval: 3500

residual:
  enabled: true

# FlashSAC's network (models/flashsac.py; its Table 9 sizes): BatchNorm inverted-residual blocks, an actor of 2
# blocks of 128 with a tanh-squashed Gaussian, critics of 2 blocks of 256; the actor's mean head started for a
# residual, its std fixed
model:
  architecture: flashsac
  actor:
    hidden_size: 128
    num_blocks: 2
    mean_init_scale: 0.01
    # resip_ppo_replica's exp(-1)
    fixed_std: 0.36788
  critic:
    hidden_size: 256
    num_blocks: 2

# alpha fixed at 0 (the actor maximizes Q alone), and kept out of the critic's target
sac:
  learn_entropy: false
  initial_entropy_value: 0.0
  backup_entropy: false
  # data only for 700 steps; the critics from step 700, the actor from step 2100
  learning_starts: 700
  policy_learning_starts: 2100
  # a fresh noise draw every step (the foundation: FlashSAC's noise repetition)
  noise_repeat: false
  # the reward carried back 50 steps per backup; the target critics 5x faster
  n_step: 50
  polyak: 0.05

# residual_flash_sac v5: v4 (the actor's mean head at orthogonal gain 0.01, every state's std at 0.15, both heads out of
# weight normalization, the log std bounded to [log 0.01, log 1.0]) with the temperature learning 100x slower
# (sac.entropy_lr 3e-6, the foundation's 3e-4). In v4 the bound did not stop the std from climbing.
#   python scripts/train.py --config configs/experiments/residual_flash_sac/residual_flash_sac_v5.yaml --headless
base: _foundation.yaml

wandb:
  group: residual_flash_sac_v5

task:
  cfg:
    scene:
      num_envs: 1024

# resip_ppo_replica's run length and checkpoint interval (published every 1000 steps, the default, as that run)
trainer:
  learner: sac
  total_timesteps: 100100
  checkpoint_interval: 3500

residual:
  enabled: true

# FlashSAC's network (models/flashsac.py; its Table 9 sizes): BatchNorm inverted-residual blocks, an actor of 2
# blocks of 128 with a tanh-squashed Gaussian whose log std a tanh bound keeps in a range, critics of 2 blocks of
# 256; the actor's heads started for a residual, its log std bounded to [log 0.01, log 1.0]
model:
  architecture: flashsac
  actor:
    hidden_size: 128
    num_blocks: 2
    mean_init_scale: 0.01
    init_std: 0.15
    # log(0.01), log(1.0)
    min_log_std: -4.605170185988091
    max_log_std: 0.0
  critic:
    hidden_size: 256
    num_blocks: 2

# the temperature learns 100x slower than FlashSAC's 3e-4
sac:
  entropy_lr: 3.0e-6

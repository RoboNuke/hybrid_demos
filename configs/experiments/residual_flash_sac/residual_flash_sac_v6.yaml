# residual_flash_sac v6: v2 (the actor's mean head at orthogonal gain 0.01 and every state's std at 0.15, both heads out
# of weight normalization; FlashSAC's [-10, 2] log-std bound and 3e-4 temperature LR, none of v3-v5's changes) with
# training started late: the first 700 steps (one 700-step episode of all 1024 envs, ~717k transitions of the initial
# policy) collect data only; the critics train from step 700; the actor -- and with it the temperature, which steps
# only with the actor -- from step 2100, after ~2800 critic updates (2 per step), so the critics have learned what
# the initial policy's noise does before the actor and its entropy term move.
#   python scripts/train.py --config configs/experiments/residual_flash_sac/residual_flash_sac_v6.yaml --headless
base: _foundation.yaml

wandb:
  group: residual_flash_sac_v6

task:
  cfg:
    scene:
      num_envs: 1024

# resip_ppo_replica's run length and checkpoint interval (published every 1000 steps, the default, as that run)
trainer:
  learner: sac
  total_timesteps: 100100
  checkpoint_interval: 3500

residual:
  enabled: true

# FlashSAC's network (models/flashsac.py; its Table 9 sizes): BatchNorm inverted-residual blocks, an actor of 2
# blocks of 128 with a tanh-squashed Gaussian whose log std its tanh bound keeps in (-10, 2), critics of 2 blocks of
# 256; the actor's heads started for a residual
model:
  architecture: flashsac
  actor:
    hidden_size: 128
    num_blocks: 2
    mean_init_scale: 0.01
    init_std: 0.15
  critic:
    hidden_size: 256
    num_blocks: 2

# data only for 700 steps; the critics from step 700, the actor and the temperature from step 2100
sac:
  learning_starts: 700
  policy_learning_starts: 2100

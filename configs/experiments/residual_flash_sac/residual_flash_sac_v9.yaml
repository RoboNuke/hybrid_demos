# residual_flash_sac v9: v8 (the mean head at gain 0.01; a fixed std of exp(-1); no entropy term; data only for 700
# steps, the critics from 700, the actor from 2100) with FlashSAC's own discount, 0.99 (the foundation has the PPO
# replica's 0.999). In v8 the categorical critic stayed near uniform -- its cross-entropy 4.40-4.52 against ln 101 = 4.62
# for a flat guess -- through ~2800 critic-only updates, and the actor then drove the residual's mean to saturation.
#   python scripts/train.py --config configs/experiments/residual_flash_sac/residual_flash_sac_v9.yaml --headless
base: _foundation.yaml

wandb:
  group: residual_flash_sac_v9

task:
  cfg:
    scene:
      num_envs: 1024

# resip_ppo_replica's run length and checkpoint interval (published every 1000 steps, the default, as that run)
trainer:
  learner: sac
  total_timesteps: 100100
  checkpoint_interval: 3500

residual:
  enabled: true

# FlashSAC's network (models/flashsac.py; its Table 9 sizes): BatchNorm inverted-residual blocks, an actor of 2
# blocks of 128 with a tanh-squashed Gaussian, critics of 2 blocks of 256; the actor's mean head started for a
# residual, its std fixed
model:
  architecture: flashsac
  actor:
    hidden_size: 128
    num_blocks: 2
    mean_init_scale: 0.01
    # resip_ppo_replica's exp(-1)
    fixed_std: 0.36788
  critic:
    hidden_size: 256
    num_blocks: 2

# alpha fixed at 0 (the actor maximizes Q alone), and kept out of the critic's target
sac:
  learn_entropy: false
  initial_entropy_value: 0.0
  backup_entropy: false
  # data only for 700 steps; the critics from step 700, the actor from step 2100
  learning_starts: 700
  policy_learning_starts: 2100
  # FlashSAC's discount for IsaacLab (the foundation: 0.999)
  discount_factor: 0.99

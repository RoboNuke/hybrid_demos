# 5. Scaled (as boxcleanup_scaled_fixed: sent = r * base, r in [-1, 3] from 1), the acting noise added to r * base in the sent
# action, unscaled by the base: sent = r_det * base + e, e ~ N(0, a1 |b| + a0) per dim (the uniform warm-up's half width
# 1.96 x that), a1 / a0 condition 3's (boxcleanup_add_linfit). The stored r carries e / base (|base| floored at 1e-6), so the
# critics' r * base is the sent action. The target smoothing as boxcleanup_scaled_fixed's (0.05, multiplier units). On the relative action (_relative.yaml). A finger's command is c_prev + r (base - c_prev): it follows the base while r stays in (0, 2).
base:
  - _foundation.yaml
  - _relative.yaml

wandb:
  group: boxcleanup_scaled_linfit

multiply_residual:
  enabled: true
  invert_floor: [0.01]

residual_noise:
  mode: linear
  linear:
    # the notebook's slice fit, data/var_mlps/boxcleanup_residual.pt's report, as fitted (fixed here; s = |a1 |b| + a0|)
    a1: [0.0980965, -0.0918121, -0.0158115, 0.20933, 0.139491, 0.316671, 0.842663, 0.948469, 0.945361, 0.913191, 0.648149, 0.948843, 0.109539, -0.127055, -0.0160288, 0.317422, 0.376549, 0.207382, 0.866484, 0.93007, 0.923684, 0.776204, 0.863017, 0.852371]
    a0: [0.195586, 0.282709, 0.202935, 0.0601008, 0.0668062, 0.0550908, 0.0267451, 0.0141509, 0.0188447, 0.0209551, 0.0194444, 6.75954e-05, 0.164364, 0.244634, 0.203896, 0.0569561, 0.0548051, 0.0587894, 0.02059, 0.0145451, 0.0148193, 0.0211593, 0.00807318, -6.29342e-05]
  warmup_scale: 1.96
  scaled_units: sent

ddpg:
  action_range:
    - -1.0
    - 3.0
  warmup_noise:
    scale: registered
    target_scale: 0.05
  train_noise:
    scale: registered
    target_scale: 0.05

model:
  actor:
    output_bias: 0.0

# Diffusion-policy BC on one_leg as ResiP trains its state base policy (Ankile et al. 2024,
# arXiv 2407.16677: Tables III and IV; robust-rearrangement's experiment/state/diff_unet.yaml):
# the 1-D U-Net [256, 512, 1024] (66M parameters), horizons 32 / 1 / 8, DDPM 100 steps
# (squaredcos, epsilon), DDIM at inference, AdamW lr 1e-4, weight decay 1e-6, cosine with 500
# warmup steps, batch 256, no EMA, 400k gradient steps, rollouts every 10 epochs, best
# checkpoint by rollout success, 50 demos -- in ResiP's sim (configs/base/furniture_resip.yaml).
#
# Not ResiP's, on purpose: warm start off (theirs always warm-starts each chunk), 128 rollout
# envs (theirs 256-512; GPU memory), DDIM 16 steps (their repo's config; the paper's table says
# 4 -- set model.actor.inference_steps=4 to match it; it changes inference only).
#
#   python scripts/train_bc.py --config configs/experiments/diffusion_bc_furniture_resip.yaml --headless
base: ../base/furniture_resip.yaml

experiment:
  seed: 42

wandb:
  group: diffusion_bc_furniture_resip

task:
  cfg:
    scene:
      # rollout envs: one round of eval.num_rollouts episodes (drop both to 64 if the GPU runs out)
      num_envs: 128

trainer:
  learner: diffusion_bc
  # gradient steps: 400 epochs x bc.steps_per_epoch (paper Table III: 400k)
  total_timesteps: 400000
  checkpoint_interval: 50000

model:
  architecture: diffusion_unet
  actor:
    horizon: 32
    n_obs_steps: 1
    action_horizon: 8
    down_dims: [256, 512, 1024]
    diffusion_step_embed_dim: 256
    kernel_size: 5
    n_groups: 8
    num_diffusion_iters: 100
    inference_steps: 16
    warm_start: false

bc:
  dataset: data/furniture_one_leg_resip
  obs_key: observation.state_abs
  action_key: action.abs
  num_demos: 50
  batch_size: 256
  steps_per_epoch: 1000
  lr: 1.0e-4
  weight_decay: 1.0e-6
  lr_schedule: cosine
  warmup_steps: 500
  rollout_every: 10
  rollout_loss_threshold: 1000.0

eval:
  num_rollouts: 128

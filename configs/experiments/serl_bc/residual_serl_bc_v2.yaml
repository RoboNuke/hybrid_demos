# SERL_BC v1 with the learned std held near its target: in v1 the insert std rose to ~0.85 within its first updates
# (~17 mm of exploration noise per axis) while the temperature, stepped once per chunk at 3e-4, barely moved (0.010 ->
# 0.007); insertion in training fell from 95% to 5% and screw stopped getting data.
# * the std capped at 0.2 (model.actor.max_log_std log 0.2): 4 mm / 1.2 deg per axis at most
# * the temperature 10x faster (sac.entropy_lr 3e-3), so it pulls the std toward the target entropy (-14, ~0.15)
#   python scripts/train.py --config configs/experiments/serl_bc/residual_serl_bc_v2.yaml --headless
base: residual_serl_bc_v1.yaml

wandb:
  group: serl_bc_v2

sac:
  entropy_lr: 3.0e-3

model:
  actor:
    # log(0.2)
    max_log_std: -1.6094379124341003

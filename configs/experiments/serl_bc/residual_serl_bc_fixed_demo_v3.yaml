# SERL_BC fixed_demo v3: fixed_demo v2 posed better for the critics:
#   * legs 1-3 and the front obstacle out of the residual's observation and critic state (the base still sees
#     them): legs 1-3 do not move within an episode (std 0.0001 over the demos) but differ between episodes
#     (0.034), an episode ID the critics could memorize outcomes by; the obstacle is fixed
#   * the critics take the executed action (the sent absolute targets, normalized), not r beside the base action
#   * the residual is the pose alone (6 per step); the gripper is the base's
#   * discount 0.99 per step (was 0.999); the target entropy -|A| / 2 = -3 for the 6-dim action
# Its own demos (the same columns dropped, no gripper dim).
#   python scripts/make_phase_demos.py --config configs/experiments/serl_bc/residual_serl_bc_fixed_demo_v3.yaml
#   python scripts/train.py --config configs/experiments/serl_bc/residual_serl_bc_fixed_demo_v3.yaml --headless
base: residual_serl_bc_fixed_demo_v2.yaml

wandb:
  group: serl_bc_fixed_demo_v3

residual:
  # one_leg -FBAbs-ResiP's 63: parts 5 x 9 from column 16 (top, legs 1-4), then the obstacle's x, y
  observation_drop:
    - - 25
      - 52
    - - 61
      - 63
  critic_action: full
  residual_gripper: false

sac:
  demo_transitions: data/serl_bc_fixed_demo_v3/demos_{route}.pt
  discount_factor: 0.99
  target_entropy: -3.0

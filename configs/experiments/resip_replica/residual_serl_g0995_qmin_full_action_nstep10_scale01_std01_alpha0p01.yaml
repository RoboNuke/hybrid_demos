# residual_serl_g0995_qmin_full_action_nstep10_scale01_std01_alpha0p1.yaml with alpha / 10. There (stopped at 200k
# by its "not learning" rule: the 160k-200k evals averaged 0.544 vs the base's 0.566) the critic stayed stable and
# its action gradient grew consistent (|dQ/dr| ~1e-2, cosine 0.79 between the 10 critics, the expert's action rated
# above the base's on 73% of demo states), but the actor's mean sat at ~0.1 mm: its resting point
# tanh(mu) ~ (dQ/dr) / (2 alpha) was 0.36 mm at alpha 0.1, under the 2.2 mm exploration noise. At 0.01 it is ~3.5 mm
# on demo states (the actor reached ~0.3-0.5x of it: ~1-2 mm, the demos' median correction 1.34 mm). Alpha enters
# only the actor (backup_entropy false); fixed (learn_entropy false)
#   python scripts/make_demo_transitions.py --config configs/experiments/resip_replica/residual_serl_g0995_qmin_full_action_nstep10_scale01_std01_alpha0p01.yaml
#   python scripts/train.py --config configs/experiments/resip_replica/residual_serl_g0995_qmin_full_action_nstep10_scale01_std01_alpha0p01.yaml --headless
base: residual_serl_g0995_qmin_full_action_nstep10_scale01_std01_alpha0p1.yaml


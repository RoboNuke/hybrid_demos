# residual_serl_g0995_qmin_full_action_nstep10_scale01_std01_alpha0p01.yaml with the residual as a correction in
# the end-effector's frame (A, residual.action_frame: ee: 1 cm and 5 deg per unit per step along / about the EE's
# axes, the gripper the base's) that accumulates over the base's chunk and resets when the base re-plans (B,
# residual.accumulate; the offset joins the observation). Demos stay in the critic (their r regenerated for this
# action). Everything else, the std included, as there.
#   python scripts/make_demo_transitions.py --config configs/experiments/resip_replica/residual_serl_g0995_qmin_full_action_nstep10_scale01_std01_alpha0p01_ee_accum.yaml
#   python scripts/train.py --config configs/experiments/resip_replica/residual_serl_g0995_qmin_full_action_nstep10_scale01_std01_alpha0p01_ee_accum.yaml --headless
base: residual_serl_g0995_qmin_full_action_nstep10_scale01_std01_alpha0p01.yaml

wandb:
  group: serl_g0995_qmin_full_action_nstep10_scale01_std01_alpha0p01_ee_accum

residual:
  action_frame: ee
  ee_pos_scale: 0.01
  ee_rot_scale_deg: 5.0
  accumulate: true

sac:
  # scripts/make_demo_transitions.py writes it from the base's bc.dataset
  demo_transitions: data/physic_aligned/transitions/serl_g0995_qmin_full_action_nstep10_scale01_std01_alpha0p01_ee_accum.pt

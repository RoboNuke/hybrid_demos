# resip_replica (the leading _ keeps launch_train from submitting this file on its own): diffusion-policy BC on one_leg after ResiP (Ankile et al. 2024), then residual SAC on the
# frozen BC policy. What both share: the env (base/fb_one_leg.yaml), the seed, the wandb entity, and the
# training parameters of both. bc_resip_replica.yaml and residual_resip_replica.yaml launch them: each sets
# its learner (trainer), its model, its wandb project and group and its env count; the residual one also
# switches the residual and the history on (here they would wrap the BC rollouts' env too).
base: ../../base/fb_one_leg.yaml

experiment:
  seed: 42

wandb:
  entity: hur

# -- BC (scripts/train_bc.py): ResiP's released one_leg recipe (robust-rearrangement's checkpoint config)
bc:
  dataset: data/physic_aligned
  obs_key: observation.state_abs
  action_key: action.abs
  num_demos: 50
  normalization: per_dim
  batch_size: 1024
  steps_per_epoch: 1000
  lr: 1.0e-4
  weight_decay: 1.0e-6
  lr_schedule: cosine
  warmup_steps: 2000
  # rollouts every 10 epochs (10k gradient steps), whatever the test loss (ResiP waits for 0.1)
  rollout_every: 10
  rollout_loss_threshold: 1000.0
  # only the best rollout's checkpoint, on disk and in wandb (~800 MB each)
  save_only_best_ckpt: true

eval:
  # BC rollouts per evaluation
  num_rollouts: 512

# -- residual SAC (scripts/train.py), after SERL (Luo et al. 2024): 10 critics (target min over a random
# 2, 10 critic updates per env step, the actor once per env step on the ensemble mean), no entropy in the
# critic's target, the temperature on the batch's next observations, target entropy -|A|/2; half of every
# critic batch demos for the whole run; an 8-step history of the EE position and velocity; the residual
# bounded at 10% of the base's normalized action range per dim, over all 10 absolute action dims (ResiP's
# action_scale 0.1)
memory:
  # every transition of the run (residual_resip_replica.yaml's trainer.total_timesteps): nothing is dropped
  memory_size: 432000

sac:
  # over the 1000-step episode: 0.999^1000 = 0.37 of a success reaches the start (0.99^1000 = 4e-5)
  discount_factor: 0.999
  batch_size: 256
  # the agent's input is already the base's normalized observation and action (and the history of
  # those columns): no running normalizer on top (SERL has none; ResiP only clamps)
  normalize_observations: false
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  entropy_lr: 3.0e-4
  initial_entropy_value: 1.0e-2
  # SERL's -|A| / 2, |A| = 10
  target_entropy: -5.0
  # SERL: the critics' target is reward alone, the entropy shapes only the actor
  backup_entropy: false
  # SERL: the temperature reads the policy's entropy at the critic batch's next observations
  entropy_observations: next
  cuda_graph: true
  num_critics: 10
  critic_subset: 2
  actor_q_reduction: mean
  gradient_steps: 10
  policy_delay: 10
  learning_starts: 0
  # 2 episodes of critic-only warm-up
  policy_learning_starts: 2000
  # scripts/make_demo_transitions.py writes it from the base's bc.dataset
  demo_transitions: data/physic_aligned/transitions/serl_resip_replica.pt
  demo_sampling_start: 0
  # half of every critic batch is demos for the whole run: residual_resip_replica.yaml's
  # trainer.total_timesteps
  demo_sampling_end: 432000

residual:
  # the frozen base: the BC run on wandb (under wandb.entity), in another project than the residual's
  base_project: hybrid_demo_furniture
  base_run_name: physic_aligned_evalHappy_a0
  base_checkpoint: actor_chkpt_best_success_rate.pt
  action_scale: null
  action_scale_fraction: 0.1

history:
  length: 8
  terms:
    - ee_pos
    - ee_pos_vel

# residual_serl_g0995_qmin_full_action_nstep10_scale01_std01_alpha0p01.yaml with no demo transitions in the
# critic's batches: does the critic tell demo from online states and pull the residual to zero? Without the
# demos filling the buffer the critic first waits for 10k env steps of the actor's own data (learning_starts;
# the earlier run started at 0), and the actor keeps its 2k-step critic-only lead (policy_learning_starts
# 2000 -> 12000). Compare at its step s + 10k against the earlier run's step s (to 120k).
#   python scripts/train.py --config configs/experiments/resip_replica/residual_serl_g0995_qmin_full_action_nstep10_scale01_std01_alpha0p01_no_demo_critic.yaml --headless
base: residual_serl_g0995_qmin_full_action_nstep10_scale01_std01_alpha0p01.yaml

wandb:
  group: serl_g0995_qmin_full_action_nstep10_scale01_std01_alpha0p01_no_demo_critic

sac:
  # no demos: the critic batch is online only
  demo_transitions: null
  demo_sampling_end: 0
  learning_starts: 10000
  policy_learning_starts: 12000

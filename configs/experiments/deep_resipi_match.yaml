# deep_resipi_match: diffusion-policy BC on one_leg matched as closely as we can to ResiP's
# state base policy (Ankile et al. 2024, arXiv 2407.16677: Tables III and IV;
# robust-rearrangement's experiment/state/diff_unet.yaml). Starts from
# diffusion_bc_furniture_resip.yaml (kept as the record of the earlier setup); the changes:
#
# * the obstacles move +-2 cm per reset (ResiP's low randomness) and the gripper is the
#   port's original (600 N/m, 13 N, 0.2 m/s) -- both the task's own now
#   (Robonuke_Furniture_Bench apply_resip), so new demos are needed, collected with the
#   obstacles moving (below);
# * the observation also holds the front obstacle's pose (70 wide; the task's own), as ResiP's;
# * lr warmup 10k steps (was 500) and 5M gradient steps (was 400k);
# * rollouts: warm start on, 4 DDIM steps (the paper's Table; was 16), 1000-step episodes
#   (task episode 100 s at 10 Hz; was 70 s).
#
# Everything named by this run carries "deep_resipi_match": the wandb group (run names
# deep_resipi_match_a0, the run folder runs/<project>/deep_resipi_match/...), and the
# dataset. On the cluster the group is {--group_prefix}_deep_resipi_match (the file stem).
#
# Demos (furniture repo, then here):
#   python scripts/collect_scripted.py --sim resip --out_dir ~/Robonuke_Furniture_Bench/demos_deep_resipi_match --num_demos 50
#   python scripts/import_furniture_demos.py --src ~/Robonuke_Furniture_Bench/demos_deep_resipi_match \
#       --out data/deep_resipi_match --control_hz 10 --task_name Isaac-Furniture-OneLeg-FBAbs-ResiP-v0
#   python scripts/train_bc.py --config configs/experiments/deep_resipi_match.yaml --headless
base: ../base/furniture_resip.yaml

experiment:
  seed: 42

wandb:
  group: deep_resipi_match

task:
  cfg:
    # 1000 control steps per rollout episode at 10 Hz
    episode_length_s: 100.0
    scene:
      # rollout envs: one round of eval.num_rollouts episodes (drop both to 64 if the GPU runs out)
      num_envs: 128

trainer:
  learner: diffusion_bc
  # gradient steps
  total_timesteps: 5000000
  checkpoint_interval: 50000

model:
  architecture: diffusion_unet
  actor:
    horizon: 32
    n_obs_steps: 1
    action_horizon: 8
    down_dims: [256, 512, 1024]
    diffusion_step_embed_dim: 256
    kernel_size: 5
    n_groups: 8
    num_diffusion_iters: 100
    # DDIM steps at inference (paper Table IV)
    inference_steps: 4
    # each chunk starts from the previous chunk's unexecuted tail (robust-rearrangement)
    warm_start: true

hpc:
  # the HPC launchers run this entry script (BC has its own; the package's runs sac / ppo)
  train_script: scripts/train_bc.py

bc:
  dataset: data/deep_resipi_match
  obs_key: observation.state_abs
  action_key: action.abs
  num_demos: 50
  batch_size: 256
  steps_per_epoch: 1000
  lr: 1.0e-4
  weight_decay: 1.0e-6
  lr_schedule: cosine
  warmup_steps: 10000
  rollout_every: 10
  rollout_loss_threshold: 1000.0
  # only the best rollout's checkpoint, on disk and in wandb (~800 MB each)
  save_only_best_ckpt: true

eval:
  num_rollouts: 128

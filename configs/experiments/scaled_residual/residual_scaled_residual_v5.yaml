base: _foundation.yaml
wandb:
  group: scaled_residual_v5
task:
  cfg:
    scene:
      num_envs: 1
trainer:
  learner: ddpg
  total_timesteps: 750000
residual:
  enabled: true
  action_frame: absolute
  action_rotation: absolute
  action_target: target
ddpg:
  demo_transitions: data/scaled_residual_v3/raw_demos.pt
  # the target smoothing noise (std = the training noise's scale) clipped at 6 of its std, in both phases
  warmup_noise:
    scale: 0.5
    target_scale: 0.075
    target_clip: 0.45
  train_noise:
    scale: 0.075
    target_clip: 0.45

base: _foundation.yaml
wandb:
  group: scaled_residual_v5
task:
  cfg:
    scene:
      num_envs: 1
trainer:
  learner: ddpg
  total_timesteps: 750000
residual:
  enabled: true
  action_frame: absolute
  action_rotation: absolute
  action_target: target
ddpg:
  random_action_scale: 0.5
  exploration_std: 0.075
  # the target smoothing noise (std = exploration_std) clipped at 6 of its std
  target_noise_clip: 0.45
  demo_transitions: data/scaled_residual_v3/raw_demos.pt

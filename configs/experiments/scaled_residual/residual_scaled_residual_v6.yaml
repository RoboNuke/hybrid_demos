base: _foundation.yaml
wandb:
  group: scaled_residual_v6
task:
  cfg:
    scene:
      num_envs: 1
trainer:
  learner: ddpg
  total_timesteps: 750000
model:
  actor:
    # m = 1 sits at r = 0 on [-1.5, 3.5]: atanh(0)
    output_bias: 0.0
residual:
  enabled: true
  action_frame: absolute
  action_rotation: absolute
  action_target: target
  # 2.5 of m per unit r
ddpg:
  action_range:
    - -1.5
    - 3.5
  random_action_scale: 0.75
  exploration_std: 0.1
  # the target smoothing noise (std = exploration_std) clipped at 0.15 of m
  target_noise_clip: 0.15
  actor_lr: 1.0e-6
  demo_transitions: data/scaled_residual_v3/raw_demos.pt

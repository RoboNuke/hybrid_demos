# Residual SAC on the frozen nut-threading diffusion policy, with everything residual_sac_all
# uses on peg insertion: 10 critics (target min over a random 2, 10 critic updates per env
# step, the actor once per env step on the ensemble mean), the agent's 8-step observation
# history, and the critic warmed up on the demos (half of each batch demo transitions until
# step 22400). The residual is bounded at 10% of the base's normalized action range. An env
# resets the step it succeeds (episode.reset_on_success), counted like the time limit.
#
# Training runs in the eval's conditions (configs/eval/nut_250.yaml): the bolt clamped in place,
# its estimate 2 mm off per axis, the nut at its stock offset in the gripper. The demos
# (data/forge_v1_nut_bolt_relative) were recorded with the estimate exact and the nut centred,
# episodes the run could also draw. Convert them into this run's transition format first
# (offline, no sim):
#   python scripts/make_demo_transitions.py --config configs/experiments/residual_sac_nut.yaml
#   python scripts/train.py --config configs/experiments/residual_sac_nut.yaml --headless
#
# One env runs at roughly 3.5 steps per second with the critic ensemble, so 103k steps is
# about 8 hours.
base: ../base/forge_nut_fixed_dyn.yaml

experiment:
  num_agents: 1
  seed: 42

wandb:
  group: residual_sac_nut

task:
  cfg:
    # episodes stay the base config's 30 s (449 steps), as the base was trained and evaluated
    scene:
      num_envs: 1

episode:
  reset_on_success: true

trainer:
  learner: sac
  # env steps (one env, one transition each): 23 checkpoints x 4480, as residual_sac_all
  total_timesteps: 103040
  # a point every 2240 steps
  write_interval: 2240
  checkpoint_interval: 4480
  # update time only; the memory stats cost a device query per update
  log_memory_stats: false

memory:
  # holds the whole run
  memory_size: 105000

sac:
  batch_size: 256
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  entropy_lr: 3.0e-4
  initial_entropy_value: 1.0e-2
  # 4 residual dims: -|A| / 2
  target_entropy: -2.0
  # replay each gradient step as a CUDA graph: same FP32 math, far fewer kernel launches
  cuda_graph: true
  # the critic ensemble
  num_critics: 10
  critic_subset: 2
  actor_q_reduction: mean
  gradient_steps: 10
  policy_delay: 10
  # the demo-warmed critic: from the first step; the actor from step 1000, online data only
  learning_starts: 0
  policy_learning_starts: 1000
  demo_transitions: data/forge_v1_nut_bolt_relative/transitions/residual_sac_nut.pt
  demo_sampling_start: 0
  demo_sampling_end: 22400

model:
  actor:
    # start close to "no correction": the residual's output layer is scaled down
    last_layer_scale: 0.1

residual:
  enabled: true
  # the bolt-relative nut BC run: epoch 140, 77.2% success over 250 episodes
  base_run: runs/hybrid_demo_nut/diffusion_bc_nut_bolt_relative/diffusion_bc_nut_bolt_relative_a0
  base_checkpoint: actor_chkpt_best_success_rate.pt
  # 10% of the base policy's normalized action range per dim
  action_scale: null
  action_scale_fraction: 0.1

history:
  enabled: true
  length: 8
  # the nut observation has no absolute fingertip position: its bolt-relative one instead
  terms:
    - fingertip_pos_rel_fixed
    - ft_force

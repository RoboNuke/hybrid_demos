# ResFiT on boxcleanup (the leading _ keeps launch_train from submitting this file on its own): what every training of
# the group shares. Same diagnostic as resfit_can (its _foundation.yaml lists every way ours differs from theirs): their
# recipe on a task it works on, through our pipeline.
#
# Their settings for this task, as their code resolves them: ResidualTD3BoxCleanConfig, paper run shell/paper_runs/boxcleanup/1_box_cleanup_residual_rl.sh (action_scale 0.2, actor_lr 5e-6). Every paper run explored at
# N(0, 0.05) whatever the README's algo.stddev_max/min said (those overrides never reach the schedule string the trainer
# reads). The rest is ResFiT's default: actor lr as below, critic lr 1e-4, AdamW weight decay 0.01, gradients clipped at
# 1, tau 0.005, 10 critics (the target's min over a random 2, the actor on their mean), loss (mean_k |Q_k - y|)^2, 4
# critic updates per env step and the actor on every 4th, 10k env steps of the base plus uniform +-0.2 residuals, then
# 10k critic-only updates, batch 256 half from the demos, timeouts terminal, one env per agent.
base:
  - ../../base/robosuite_boxcleanup.yaml
  - ../../methods/resfit.yaml

experiment:
  seed: 42

wandb:
  entity: hur

bc:
  dataset: data/dexmg_boxcleanup_1000
  obs_key: observation.state
  action_key: action
  num_demos: 1000
  test_split: 0.05
  batch_size: 1024
  steps_per_epoch: 1000
  lr: 1.0e-4
  weight_decay: 1.0e-6
  lr_schedule: cosine
  warmup_steps: 2000
  max_grad_norm: 0.0
  eval_every: 5
  sample_every: 100
  rollout_every: 5
  rollout_loss_threshold: 1000.0
  rollout_progress: false
  max_hours: null
  save_only_best_ckpt: true
  normalization: per_dim
  early_stop_patience: .inf
  early_stop_smooth: 0.9
  show_waypoints: false
  action_metric_groups: null

eval:
  num_rollouts: 50
  deterministic: true
  save_state: false
  record: false

# the task's own values over the method file's (configs/methods/resfit.yaml)
residual:
  # the base plans every chunk cold, as the demo residuals were measured
  base_warm_start: false
  # action_scale 0.2: the range widened by 1 + 0.2, the clamp at the widened range
  action_scale_fraction: 1.2
  executed_clip: 1.2
ddpg:
  actor_lr: 5.0e-6
  action_range:
    - -0.2
    - 0.2
  cuda_graph: true

# 3. Additive (ResFiT's scale, reach and clamp), the acting noise's std a1 |b| + a0 per dim in the sent action, fitted:
# the notebook's slice fit (data_analysis/demo_residual_analysis.ipynb's last cell: the std of executed - base in 50 slices of |b|, weighted by count) on 79520 demo frames, sent (OSC commands) units; R2 per dim [0.803, 0.874, 0.706, 0.314, 0.152, 0.571, 0.693]. The warm-up's uniform half width 1.96 x that.
base:
  - _foundation.yaml

wandb:
  group: square_add_linfit

additive_residual:
  enabled: true

residual_noise:
  mode: linear
  linear:
    # the notebook's slice fit, data/var_mlps/square_residual.pt's report, as fitted (fixed here; s = |a1 |b| + a0|)
    a1: [0.0817527, 0.159215, 0.085702, 0.0676557, -0.0725245, 0.0694468, -19.1526]
    a0: [0.0593059, 0.0482747, 0.0552521, 0.00668984, 0.02047, 0.0125573, 19.1325]
  warmup_scale: 1.96

ddpg:
  warmup_noise:
    scale: registered
    target_scale: 0.05
  train_noise:
    scale: registered
    target_scale: 0.05

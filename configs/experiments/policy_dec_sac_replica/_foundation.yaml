# policy_dec_sac_replica (the leading _ keeps launch_train from submitting this file on its own): Policy
# Decorator's recipe (policy_decorator online/pi_dec_diffusion_maniskill2.py, its defaults) on our frozen base
# physic_aligned_evalHappy_a0 and our ResiP-replica sim (base/fb_one_leg.yaml), to see what their method does on
# this task: one residual decision per 4-step base chunk (a 4 x 7 action: their delta pose's meaning, on our absolute base), the base executing 4 steps per plan
# with 4 DDIM steps, the actor on the raw observation alone, SAC with 2 critics, gamma 0.97 per chunk, tau 0.01,
# lr 1e-4, batch 1024, auto-tuned temperature (target -|A|), UTD 0.25 (16 gradient steps every 4 env steps on
# 16 envs), 8000 global steps of uniform random residuals before learning, progressive exploration over 50k
# chunk steps per env (theirs 100k global; our episodes are 5x longer), -1 reward per chunk, no demos, no history, no observation normalization; the critics take the
# executed chunk (base + residual), their critic_input "sum".
base: ../../base/fb_one_leg.yaml

experiment:
  seed: 42

wandb:
  entity: hur

residual:
  base_project: hybrid_demo_furniture
  base_run_name: physic_aligned_evalHappy_a0
  # res_scale 0.1
  action_scale: null
  action_scale_fraction: 0.1
  # the raw observation, no normalization, then the base's 4-step chunk in their command form (their actor_input
  # "obs_base_action"): each target against the current EE pose in its frame, 0.1 m / 0.1 rad per unit, 4 x 7
  normalize_observation: false
  observe_base_action: true
  ee_relative_actions: true
  ee_relative_pos_unit: 0.1
  ee_relative_rot_unit: 0.1
  # their critic_input "sum": the executed chunk, base + residual, in the same EE-relative command form (4 x 7)
  critic_action: full
  # their critic's state: the observation alone (the base chunk only rebuilds the executed action, a side input)
  critic_state: observation
  # their pd_ee_delta_pose with res_scale 0.1: r = 1 is 0.01 m and 0.01 rad (0.573 deg) composed on the base's
  # target in its own frame, plus 0.1 of the gripper's half range (action_scale_fraction); 7 per step
  action_frame: target
  ee_pos_scale: 0.01
  ee_rot_scale_deg: 0.5729577951308232
  # act_horizon 4, ddim-steps 4: one residual chunk per base plan
  steps_per_chunk: 4
  base_action_horizon: 4
  base_inference_steps: 4

sac:
  discount_factor: 0.97
  polyak: 0.01
  batch_size: 1024
  actor_lr: 1.0e-4
  critic_lr: 1.0e-4
  entropy_lr: 1.0e-4
  learn_entropy: true
  initial_entropy_value: 0.2
  # -|A| with the 4 x 7 chunk action
  target_entropy: -28.0
  entropy_loss_form: log_alpha
  backup_entropy: true
  entropy_observations: current
  num_critics: 2
  critic_subset: 2
  actor_q_reduction: min
  policy_delay: 1
  # UTD 0.25: 16 gradient steps every 4 env steps x 16 envs = 64 transitions
  gradient_steps: 16
  update_every: 4
  # learning_starts 8000 global steps / 16 envs, uniform random residuals meanwhile
  random_timesteps: 500
  learning_starts: 500
  n_step: 1
  grad_norm_clip: 50.0
  normalize_observations: false
  demo_transitions: null
  demo_sampling_end: 0
  # the residual ramped in over 50k chunk steps per env (200 episodes per env), the mask redrawn every step;
  # Policy Decorator's 100k global steps (6250 here) spans only 25 of our 250-chunk episodes
  progressive_exploration_steps: 50000
  # the actor is a plain Gaussian (model.actor.squash: false in the launch config)
  unsquashed_actor: true
  # every episode's last transition is terminal: Isaac Lab returns the next episode's first observation after a
  # reset, so bootstrapping a time limit from it would value an unrelated state
  bootstrap_time_limits: false
  # the acting std per task phase (track_phases' phase id, configs/base/fb_one_leg.yaml): policy/std_<phase>
  std_by_label: eval_state/phase/id
  std_label_names:
    - corner
    - grasp
    - insert
    - screw
  # the correction applied per task phase, over the envs running the residual: residual/position_mm_<phase> (mm) and
  # residual/rot_deg_<phase> (deg)
  metrics_by_label:
    - residual/position_mm
    - residual/rot_deg

memory:
  # every transition of the run: 250k agent steps x 16 envs
  memory_size: 4000000

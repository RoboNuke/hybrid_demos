# 3. Additive (ResFiT's scale, reach and clamp), the acting noise's std a1 |b| + a0 per dim in the sent action, fitted:
# the notebook's slice fit (data_analysis/demo_residual_analysis.ipynb's last cell: the std of executed - base in 50 slices of |b|, weighted by count) on 297769 demo frames, sent (relative) units; R2 per dim [0.924, 0.34, 0.577, 0.744, 0.53, 0.288, 0.922, 0.929, 0.905, 0.921, 0.84, 0.698, 0.694, 0.96, 0.814, 1.0, 0.971, 1.0, 0.978, 0.963, 0.936, 0.944, 0.97, 1.0]. The warm-up's uniform half width 1.96 x that. On the relative action (_relative.yaml).
base:
  - _foundation.yaml
  - _relative.yaml

wandb:
  group: coffee_add_linfit

additive_residual:
  enabled: true

residual_noise:
  mode: linear
  linear:
    # the notebook's slice fit, data/var_mlps/coffee_residual.pt's report, as fitted (fixed here; s = |a1 |b| + a0|)
    a1: [0.138138, 0.0467597, 0.134939, 0.35921, 0.0422431, 0.0312194, 0.0879559, 0.154416, 0.101734, 0.380211, 0.114623, 0.114383, 0.230883, 0.564945, 0.323347, 0.95874, 0.561716, 0.921242, 0.814645, 0.803157, 0.750575, 0.778377, 0.754659, 0.986952]
    a0: [0.0112977, 0.0120737, 0.0115999, 0.010823, 0.0143427, 0.0140025, 0.012776, 0.0116935, 0.0120506, 0.0124665, 0.0151548, 0.0138035, 0.000578783, 0.00033291, 0.000311842, 5.09658e-05, 0.0223658, 9.06672e-05, 0.0148, 0.0115143, 0.0104494, 0.00867699, 0.015515, 1.13753e-05]
  warmup_scale: 1.96

ddpg:
  warmup_noise:
    scale: registered
    target_scale: 0.05
  train_noise:
    scale: registered
    target_scale: 0.05

# Diffusion BC on the searching expert's demos (noisy observations only, spiral search):
# the run that reached 53% success (epoch 39). Everything that run set on the command line.
#
#   python scripts/train_bc.py --config configs/experiments/diffusion_bc_search.yaml --headless
base: diffusion_bc.yaml

wandb:
  group: diffusion_bc_search

task:
  cfg:
    # the rollouts' time budget (the demos all finished within 9.5 s)
    episode_length_s: 30.0

bc:
  dataset: data/expert_demos_forge_pih_search
  # roll out every 10 epochs whatever the test loss (the 0.1 gate is the reference's)
  rollout_loss_threshold: 1000.0

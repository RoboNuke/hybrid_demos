# ResFiT's residual TD3 on cansort (the foundation's settings) on our cansort base: 3 agents in one process, one env
# each, every agent its own networks, replay, schedule and wandb run; 300k env steps per agent, a checkpoint every
# 10k (ResFiT's eval interval) for the watchers (one per agent).
#   python scripts/make_robosuite_demos.py --config configs/experiments/resfit_cansort/residual_resfit_cansort.yaml \
#     --dataset data/dexmg_cansort_100   (ResFiT's offline_data.num_episodes 100; the base trained on all 1000)
#   python scripts/train.py --config configs/experiments/resfit_cansort/residual_resfit_cansort.yaml --headless
#   python scripts/watch_residual_eval.py --headless --run runs/resfit_validation_residual/resfit_cansort/resfit_cansort_a<i> \
#     --eval_config configs/eval/residual_watch_can.yaml
base: _foundation.yaml

experiment:
  num_agents: 3

wandb:
  project: resfit_validation_residual
  group: resfit_cansort

task:
  cfg:
    scene:
      num_envs: 3

trainer:
  learner: ddpg
  total_timesteps: 300000
  checkpoint_interval: 10000
  write_interval: 1000
  success_window: 10

residual:
  enabled: true
  base_run: runs/resfit_validation/bc_resfit_cansort/bc_resfit_cansort_a0
  base_project: null
  base_run_name: null

ddpg:
  # this base's demo residuals (scripts/make_robosuite_demos.py), half of every batch, the actor on the same batch
  demo_transitions: data/resfit_cansort/demos.pt
  demo_storage: sample
  demo_sampling_start: 0
  demo_sampling_end: 1000000000
  demo_batch_shared: true
  save_memory_with_checkpoints: false

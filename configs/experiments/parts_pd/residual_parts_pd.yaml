# PARTS on 1 env (_foundation.yaml): the insert and screw residuals on the frozen base physic_aligned_evalHappy_a0,
# FlashSAC's network (actor 2 blocks of 128, critics 2 of 256), a fixed std of 0.15, 1M env steps (the
# 250k 4-step chunks of the 16-env runs per env, in robot time). The demos first, CPU only:
#   python scripts/make_phase_demos.py --config configs/experiments/parts_pd/residual_parts_pd.yaml
#   python scripts/train.py --config configs/experiments/parts_pd/residual_parts_pd.yaml --headless
base: _foundation.yaml

wandb:
  project: hybrid_demo_furniture_residual
  group: parts_pd

task:
  cfg:
    scene:
      num_envs: 1
    # the env's reward as the last run (logged as reward/*); each residual trains on its own local reward
    rewards:
      step:
        weight: 0.0
      corner_done:
        weight: 1.0
      grasp_done:
        weight: 1.0
      insert_done:
        weight: 1.0

trainer:
  learner: sac
  total_timesteps: 1000000
  checkpoint_interval: 10000
  # publish every 1000 env steps; episode/success the mean of the last 10 episodes, each phase's success rate
  # (phase/passed_*, counted only for the episodes that reached the phase) the mean of the last 10 that reached it
  write_interval: 1000
  success_window: 10
  windowed_metrics:
    - phase/passed_*

residual:
  enabled: true

model:
  architecture: flashsac
  actor:
    hidden_size: 128
    num_blocks: 2
    expansion: 4
    min_log_std: -10.0
    max_log_std: 2.0
    # a near-zero residual at the start (the last run's)
    mean_init_scale: 0.01
    # a frozen exploration std, no std head: 0.15 (1.5 mm / 0.9 deg per axis), the last run's starting std; ResiP's
    # e^-1 (3.7 mm / 2.2 deg every step) ruined most training attempts
    fixed_std: 0.15
  critic:
    hidden_size: 256
    num_blocks: 2
    expansion: 4

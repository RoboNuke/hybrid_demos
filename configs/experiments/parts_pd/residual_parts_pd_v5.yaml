# residual_parts_pd_v4.yaml (absolute 2 cm / 6 deg residual about the robot-base axes, Q(s, a_base, r), cold-start base,
# PARTS' terms averaged over the action dims) with the demos for the critics only and a critic-first start:
# * each phase's demos (scripts/make_phase_demos.py, this setup's own form: the absolute residual against the
#   cold-start base, the actor's absolute base input, the critic state with the base) in its replay memory, flagged:
#   the critics train on them, the actor's loss never sees them (sac.demo_storage: memory_critic)
# * the critics learn from the first transitions (learning_starts 125 chunks, on the demos and the first episode);
#   the actor from 250 chunks (1000 env steps, about one episode)
#   python scripts/make_phase_demos.py --config configs/experiments/parts_pd/residual_parts_pd_v5.yaml
#   python scripts/train.py --config configs/experiments/parts_pd/residual_parts_pd_v5.yaml --headless
base: residual_parts_pd_v4.yaml

wandb:
  group: parts_pd_v5

sac:
  demo_transitions: data/parts_pd_v5/demos_{route}.pt
  demo_storage: memory_critic
  learning_starts: 125
  policy_learning_starts: 250

# residual_parts_pd_v2.yaml with PARTS' chunk-level residual (Su et al., arXiv:2609.21788, eqs. 2-3): one residual
# decision per 4-step base chunk (a 4 x 7 action, the base executing 4 steps per plan), the critics' TD over the chunk
# with 3-chunk returns (sac.n_step 3, 12 env steps), and no correlated noise: a fresh Gaussian draw per chunk. Every
# count in env steps keeps v2's robot time (a chunk is 4 env steps): 1M env steps, checkpoints every 10k, a point
# every 1000, learning from each residual's 500th env step, no retraining; the discount keeps v2's horizon, 0.999 per env step.
# The no-progress reset still counts env steps (furniture.stall_steps_*); a chunk is still when all its 4 are.
# The demos are this setup's own (4-step chunks):
#   python scripts/make_phase_demos.py --config configs/experiments/parts_pd/residual_parts_pd_v3.yaml
#   python scripts/train.py --config configs/experiments/parts_pd/residual_parts_pd_v3.yaml --headless
base: residual_parts_pd_v2.yaml

wandb:
  group: parts_pd_v3

trainer:
  total_timesteps: 250000
  checkpoint_interval: 2500
  write_interval: 250

residual:
  steps_per_chunk: 4

sac:
  # 0.999 per env step over a 4-step chunk
  discount_factor: 0.996
  learning_starts: 125
  noise_repeat: false
  # the EE-relative base chunk, 4 x 7, last in the actor's observation
  reference_columns: 28
  # no success-reweighted retraining in this run
  retrain_every: 0
  demo_transitions: data/parts_pd_v3/demos_{route}.pt

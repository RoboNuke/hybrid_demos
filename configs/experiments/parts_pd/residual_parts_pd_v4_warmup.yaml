# residual_parts_pd_v4.yaml with the first 5 episodes run on the base alone (zero residual, no exploration noise),
# stored as ordinary transitions, and no update until they have ended (sac.warmup_episodes): the replay memory starts
# with the base's own outcomes, its successes among them, instead of only the exploring residual's.
#   python scripts/train.py --config configs/experiments/parts_pd/residual_parts_pd_v4_warmup.yaml --headless
base: residual_parts_pd_v4.yaml

wandb:
  group: parts_pd_v4_warmup

sac:
  warmup_episodes: 5

# parts_pd (the leading _ keeps launch_train from submitting this file on its own): PARTS (Su et al.,
# arXiv:2609.21788) on flashsac_pd's last run (residual_flashsac_pd_parts_grasp.yaml: B's target-frame residual,
# 0.01 m / 6 deg / 0.1 gripper per unit, EE-relative base action and critic action, critics on the observation
# alone, FlashSAC's network and critic, PARTS' actor terms), set up as a single real robot would run it: 1 env, one
# residual per bottleneck phase (sac.route_labels: insert, screw), each its own actor, critics, optimizers and
# replay memory with a local reward (1 when its phase is passed, the attempt then over), a fixed exploration std
# (0.15), no entropy term, no exploration ramp, no masking or restaging, the demos in the replay memory. The
# residual acts every env step on that step's base action (no chunk); the base still re-plans every 4 steps with 4
# DDIM steps.
base: ../flashsac_pd/_foundation.yaml

residual:
  # one residual decision per env step (7 wide); B's chunk of 4 is gone
  steps_per_chunk: 1
  # 6 deg per unit r on each rotation axis, as the last run
  ee_rot_scale_deg: 6.0

sac:
  # one residual per phase, each with every setting of this section (route_labels drops what store_labels and
  # residual.active_from_phase did: a residual stores and acts only in its own phase, the base alone elsewhere)
  route_labels:
    - insert
    - screw
  # success: a screw attempt that ends in assembly is passed (its local reward 1)
  std_label_names:
    - corner
    - grasp
    - insert
    - screw
    - success
  discount_factor: 0.999
  # FlashSAC's single-env setting (its Table 10): batch 512, 1 update per env step, the actor every 2nd (as 2
  # updates every 2 env steps: sac.policy_delay may not exceed gradient_steps)
  batch_size: 512
  gradient_steps: 2
  update_every: 2
  # a fixed std (model.actor.fixed_std) and no entropy term: temperature 0, not learned, nothing in the backup
  learn_entropy: false
  initial_entropy_value: 0.0
  target_entropy_sigma: null
  backup_entropy: false
  # no progressive exploration ramp, no noise repetition: a fresh draw every step
  progressive_exploration_steps: 0
  noise_repeat: false
  # PARTS' actor loss: clone successful attempts (lambda+ 1), anchor failed ones at zero (lambda- 1), the Q term
  # at TD3+BC's 2.5 / mean|Q|; the outcome is each residual's local one (route_label), not the episode's. No
  # success-reweighted retraining in this run (retrain_every 0)
  success_clone_weight: 1.0
  failure_anchor_weight: 1.0
  actor_q_scale: 2.5
  # each phase's demo transitions (scripts/make_phase_demos.py) written into its replay memory before the first
  # step: ordinary rows the memory overwrites when it wraps (no symmetric sampling); each demo episode is a
  # success, so the clone term reads them as it reads successful online attempts
  demo_transitions: data/parts_pd/demos_{route}.pt
  demo_storage: memory

memory:
  # every transition of the run, per residual: 1M env steps x 1 env
  memory_size: 1000000

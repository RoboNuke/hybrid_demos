# residual_resfit_coffee.yaml with its own demo file. It was written to add ResFiT's input standardization (a residual
# field that no longer exists: the inputs' normalization is the model's, ddpg.state_preprocessor) and ResFiT's 0.05
# half-range floor (now the method file's, configs/methods/resfit.yaml, for every task).
# residual_resfit_coffee.yaml (min-max inputs, a half range of 1 for the constant dims) fell to 0 success at 20k on all
# three agents, every one pushing |r| 0.05-0.19 on every dim.
#   python scripts/make_robosuite_demos.py --config configs/experiments/resfit_coffee/residual_resfit_coffee_v2.yaml
#   python scripts/train.py --config configs/experiments/resfit_coffee/residual_resfit_coffee_v2.yaml --headless
#   python scripts/watch_residual_eval.py --headless --run runs/resfit_validation_residual/resfit_coffee_v2/resfit_coffee_v2_a<i> \
#     --eval_config configs/eval/residual_watch_robosuite_rounds.yaml --steps <step> --skip_base
base: _foundation.yaml

experiment:
  num_agents: 3

wandb:
  project: resfit_validation_residual
  group: resfit_coffee_v2

task:
  cfg:
    scene:
      num_envs: 3

trainer:
  learner: ddpg
  total_timesteps: 500000
  checkpoint_interval: 10000
  write_interval: 1000
  success_window: 10

residual:
  enabled: true
  base_run: runs/resfit_validation/bc_resfit_coffee/bc_resfit_coffee_a0
  base_project: null
  base_run_name: null

ddpg:
  # this base's demo residuals (scripts/make_robosuite_demos.py), half of every batch, the actor on the same batch
  demo_transitions: data/resfit_coffee_v2/demos.pt
  demo_storage: sample
  demo_sampling_start: 0
  demo_sampling_end: 1000000000
  demo_batch_shared: true
  save_memory_with_checkpoints: false

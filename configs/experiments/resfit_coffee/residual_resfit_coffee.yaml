# ResFiT's residual TD3 on coffee (the foundation's settings) on our coffee base: 3 agents in one process, one env
# each, every agent its own networks, replay, schedule and wandb run; 500k env steps per agent, a checkpoint every
# 10k (ResFiT's eval interval) for the watchers (one per agent).
#   python scripts/make_robosuite_demos.py --config configs/experiments/resfit_coffee/residual_resfit_coffee.yaml
#   python scripts/train.py --config configs/experiments/resfit_coffee/residual_resfit_coffee.yaml --headless
#   python scripts/watch_residual_eval.py --headless --run runs/resfit_validation_residual/resfit_coffee/resfit_coffee_a<i> \
#     --eval_config configs/eval/residual_watch_can.yaml
base: _foundation.yaml

experiment:
  num_agents: 3

wandb:
  project: resfit_validation_residual
  group: resfit_coffee

task:
  cfg:
    scene:
      num_envs: 3

trainer:
  learner: ddpg
  total_timesteps: 500000
  checkpoint_interval: 10000
  write_interval: 1000
  success_window: 10

residual:
  enabled: true
  base_run: runs/resfit_validation/bc_resfit_coffee/bc_resfit_coffee_a0
  base_project: null
  base_run_name: null

ddpg:
  # this base's demo residuals (scripts/make_robosuite_demos.py), half of every batch, the actor on the same batch
  demo_transitions: data/resfit_coffee/demos.pt
  demo_storage: sample
  demo_sampling_start: 0
  demo_sampling_end: 1000000000
  demo_batch_shared: true
  save_memory_with_checkpoints: false

# 2 x 1024 ReLU MLPs with LayerNorm (ResFiT's actor and critic heads), PyTorch's default init, the actor's last layer
# zero (r = 0 at the start)
model:
  architecture: mlp
  actor:
    hidden_size: 1024
    num_layers: 2
    activation: ReLU
    layer_norm: true
    init: default
    output_init_scale: 0.0
    squash: true
  critic:
    hidden_size: 1024
    num_layers: 2
    activation: ReLU
    layer_norm: true
    init: default

# BC: resip_replica/bc_resip_replica.yaml (ResiP's U-Net on the 50 scripted demos, the setup
# physic_aligned_evalHappy_a0 trained with) on the interface relative to the end-effector: the same
# model, the same demos (_foundation.yaml's bc section: their relative columns), 150k gradient steps.
# Train:
#   python scripts/train_bc.py --config configs/experiments/resip_replica_rel/bc_resip_replica_rel.yaml --headless
base: _foundation.yaml

wandb:
  project: hybrid_demo_furniture
  group: bc_resip_replica_rel_v2

task:
  cfg:
    scene:
      # one round of eval.num_rollouts rollouts
      num_envs: 512

trainer:
  learner: diffusion_bc
  # gradient steps
  total_timesteps: 150000
  checkpoint_interval: 50000

hpc:
  # the HPC launchers run this entry script (BC has its own; the package's runs sac / ppo)
  train_script: scripts/train_bc.py

model:
  architecture: diffusion_unet
  actor:
    horizon: 32
    n_obs_steps: 1
    action_horizon: 8
    down_dims: [256, 512, 1024]
    diffusion_step_embed_dim: 256
    kernel_size: 5
    n_groups: 8
    num_diffusion_iters: 100
    # DDIM steps in the rollouts (their checkpoint's actor)
    inference_steps: 16
    # each chunk starts from the previous chunk's unexecuted tail (robust-rearrangement)
    warm_start: true

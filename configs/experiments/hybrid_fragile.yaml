# Hybrid force/position SAC on the demo task with a fragile peg -- the package's e2e
# hybrid settings (V's fixed-gain SAC baseline + the 10 N break force), on this project's
# own registered env.
#
#   python scripts/train.py --config configs/experiments/hybrid_fragile.yaml --headless
base: ../base/forge_demo.yaml

experiment:
  num_agents: 3
  seed: 42

wandb:
  group: hybrid_fragile

task:
  cfg:
    scene:
      num_envs: 768
      # the contact sensor needs real per-env prims, not Fabric-cloned ones
      clone_in_fabric: false

sac:
  gradient_steps: 8
  batch_size: 1024
  actor_lr: 1.0e-4
  critic_lr: 1.0e-4
  entropy_lr: 1.0e-4
  weight_decay: 1.0e-2
  learning_starts: 300
  initial_entropy_value: 1.0e-2
  # 13 action dims - 3 Bernoulli selection = 10 continuous; -|continuous|/2
  target_entropy: -5.0

model:
  actor:
    act_init_std: 1.0
    last_layer_scale: 0.1
    scale_down_action_dims: [0, 1, 2, 3, 4, 5]
    bernoulli_action_dims: [7, 8, 9]
  critic:
    critic_n: 4
    critic_latent: 1024

controller:
  enabled: true
  use_force: true
  # force_axes defaults to [1, 1, 1, 0, 0, 0]: hybrid on translation, orientation
  # always position-controlled

wrappers:
  fragile:
    enabled: true
    break_force: [10.0]
  efficient_reset:
    enabled: true
  contact:
    enabled: true
    append_to_critic_state: true

# the project's own loss, registered in scripts/*.py setup(); weight 0 keeps it a no-op
# demonstration -- raise it (or delete the term) for real experiments
losses:
  terms:
    - name: demo_log_prob_penalty
      target: policy
      weight: 0.0

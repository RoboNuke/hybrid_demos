# residual_sac_all with the residual bounded at 20% of the base's normalized action range
# instead of 10% (~12 mm, ~9 deg), the only change. Policy Decorator sets this bound near the
# action scale the demos need; 11.5% of the expert's steps needed more than the 10% bound.
# Its demo transitions are divided by the scale, so it has its own file.
#
#   python scripts/make_demo_transitions.py --config configs/experiments/residual_sac_all_scale02.yaml
#   python scripts/train.py --config configs/experiments/residual_sac_all_scale02.yaml --headless
#   python scripts/watch_residual_eval.py --run runs/hybrid_demo_pih/residual_sac_all_scale02/residual_sac_all_scale02_a0
base: residual_sac_all.yaml

wandb:
  group: residual_sac_all_scale02

residual:
  action_scale_fraction: 0.2

sac:
  demo_transitions: data/expert_demos_forge_pih_search/transitions/residual_sac_all_scale02.pt

# Residual SAC on the frozen diffusion policy, one env: the env runs the base (chunks of 32,
# 8 executed), SAC learns a per-step correction added to the base's [x, y, z, yaw] action.
#
#   python scripts/train.py --config configs/experiments/residual_sac.yaml --headless
#   python scripts/watch_residual_eval.py --run runs/hybrid_demo_pih/residual_sac/residual_sac_a0
#
# One env steps at roughly 5 per second (Forge's GPU physics cost does not shrink with fewer
# envs), so ~103k steps is about 5-6 hours.
base: ../base/forge_fixed_dyn.yaml

experiment:
  num_agents: 1
  seed: 42

wandb:
  group: residual_sac

task:
  cfg:
    # 15 s = 225 control steps at 15 Hz
    episode_length_s: 15.0
    scene:
      num_envs: 1

trainer:
  learner: sac
  # env steps (with one env, one transition each): 23 checkpoints x 4480, so the last
  # checkpoint is the run's last step (scripts/watch_residual_eval.py stops there)
  total_timesteps: 103040
  # a 15 s episode is 224 steps (Forge ends it one step before the 225-step limit):
  # publish every 10 episodes, so each point is a 10-episode mean and success rate
  write_interval: 2240
  # a numbered checkpoint every 20 episodes
  checkpoint_interval: 4480
  # update time only; the memory stats cost a device query per update
  log_memory_stats: false

memory:
  # holds the whole run
  memory_size: 100000

sac:
  # one env: one gradient step per transition
  gradient_steps: 1
  batch_size: 256
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  entropy_lr: 3.0e-4
  # ~4 episodes of data before the first update
  learning_starts: 1000
  initial_entropy_value: 1.0e-2
  # 4 residual dims: -|A| / 2
  target_entropy: -2.0
  # replay each gradient step as a CUDA graph: same FP32 math, far fewer kernel launches
  cuda_graph: true

model:
  actor:
    # start close to "no correction": the residual's output layer is scaled down
    last_layer_scale: 0.1

residual:
  enabled: true
  # the search-expert BC run: epoch 39, 53% success (measured with 30 s episodes)
  base_run: runs/hybrid_demo_pih/diffusion_bc_search/diffusion_bc_search_a0
  base_checkpoint: actor_chkpt_best_success_rate.pt
  # null: 10% of the base policy's normalized action range per dim (the reference's 0.1)
  action_scale: null

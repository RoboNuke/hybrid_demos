# Residual SAC with hybrid force/position control on FurnitureBench one_leg in ResiP's sim, on
# the frozen ResiP-recipe diffusion policy (diffusion_bc_furniture_resip). The env is ResiP's
# with the arm on joint torques (Isaac-Furniture-OneLeg-FBAbs-ResiP-Hybrid-v0,
# Robonuke_Furniture_Bench mdp/hybrid.py: robonuke_rl_core's Forge law, every physics substep).
# The base gives the 10-wide abs target; the agent's action is
#   [abs target correction 10 | force-or-position choice x, y, z | force target x, y, z]
# a choice > 0 is force control, a force target in [-1, 1] is +-10 N. The agent also observes the
# measured EE force (force_obs, no torque), which force_selection reads: the harder the arm is
# pushing on an axis, the more that axis should be force-controlled.
#
# The rest is the residual_sac_furniture recipe (10 critics, 8-step history), without demo
# transitions (no demos with the force observation yet): the critic and actor learn from online
# data from step 1000.
#
#   python scripts/train.py --config configs/experiments/residual_hybrid_furniture_resip.yaml --headless
base: ../base/furniture_resip.yaml

experiment:
  num_agents: 1
  seed: 42

wandb:
  group: residual_hybrid_furniture_resip

task:
  name: Isaac-Furniture-OneLeg-FBAbs-ResiP-Hybrid-v0
  cfg:
    scene:
      num_envs: 1
    hybrid:
      force_axes: [1, 1, 1, 0, 0, 0]
      force_target_bounds: [10.0, 10.0, 10.0, 5.0, 5.0, 5.0]

trainer:
  learner: sac
  # a 70 s episode is 700 steps at 10 Hz: a point every 10 episodes, a checkpoint every 20
  total_timesteps: 112000
  write_interval: 7000
  checkpoint_interval: 14000
  log_memory_stats: false

memory:
  memory_size: 112000

sac:
  batch_size: 256
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  entropy_lr: 3.0e-4
  initial_entropy_value: 1.0e-2
  # 16 action dims: -|A| / 2
  target_entropy: -8.0
  cuda_graph: true
  num_critics: 10
  critic_subset: 2
  actor_q_reduction: mean
  gradient_steps: 10
  policy_delay: 10
  learning_starts: 1000

model:
  actor:
    last_layer_scale: 0.1
    # the force-or-position choices, after the 10-wide abs target (hybrid.validate checks it)
    bernoulli_action_dims: [10, 11, 12]

residual:
  enabled: true
  base_run: runs/hybrid_demo_furniture/diffusion_bc_furniture_resip/diffusion_bc_furniture_resip_a0
  base_checkpoint: actor_chkpt_best_success_rate.pt
  action_scale: null
  action_scale_fraction: 0.1

hybrid:
  # the furniture env owns the controller (task.cfg.hybrid); this turns the action blocks on
  enabled: true

history:
  enabled: true
  length: 8
  terms:
    - ee_pos
    - ee_pos_vel

force_obs:
  enabled: true
  mode: no_torque

losses:
  terms:
    - name: force_selection
      target: policy
      weight: 1.0
      # captured in SAC's CUDA graph with the rest of the gradient step
      graph_safe: true
      kwargs:
        # target 0.5 at 3.5 N, ~0.05 at 2 N, ~0.95 at 5 N
        scale: 2.0
        offset: 3.5
        mode: no_torque

# policy_dec_replica_chunk (the leading _ keeps launch_train from submitting this file on its own):
# resip_replica's diffusion-policy BC on one_leg (base/fb_one_leg.yaml: the FBAbs ResiP task, its
# observation and absolute action) with the network predicting every step of its chunk relative to the
# EE pose at its observation (model.actor.action_frame: ee_at_obs, set in the launch config). What its
# trainings share: the env, the seed, the wandb entity and the BC parameters -- resip_replica's bc and
# eval sections unchanged on the same 50 demos (data/physic_aligned, what evalHappy trained on), but for
# the action used as it is.
base: ../../base/fb_one_leg.yaml

experiment:
  seed: 42

wandb:
  entity: hur

# -- BC (scripts/train_bc.py): ResiP's released one_leg recipe (robust-rearrangement's checkpoint config)
bc:
  # the absolute targets; the trainer expresses each window's in the EE frame of its observation
  dataset: data/physic_aligned
  obs_key: observation.state_abs
  action_key: action.abs
  num_demos: 50
  normalization: per_dim
  # the EE-frame action in m and rad, unscaled: used as it is, so a zero output is the observation's
  # EE pose
  normalize_action: false
  batch_size: 1024
  steps_per_epoch: 1000
  lr: 1.0e-4
  weight_decay: 1.0e-6
  lr_schedule: cosine
  warmup_steps: 2000
  # rollouts every 10 epochs (10k gradient steps), whatever the test loss (ResiP waits for 0.1)
  rollout_every: 10
  rollout_loss_threshold: 1000.0
  # only the best rollout's checkpoint, on disk and in wandb (~800 MB each)
  save_only_best_ckpt: true

eval:
  # BC rollouts per evaluation
  num_rollouts: 512

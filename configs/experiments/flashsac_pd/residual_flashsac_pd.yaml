# B's residual trained by FlashSAC (_foundation.yaml) on 16 envs: FlashSAC's network (actor 2 blocks of 128, critics 2
# blocks of 256, BatchNorm inverted residual, post RMSNorm), 250k chunk steps per env, phase rewards +1 each and +1 at
# assembly, as B.
#   python scripts/train.py --config configs/experiments/flashsac_pd/residual_flashsac_pd.yaml --headless
base: _foundation.yaml

wandb:
  project: hybrid_demo_furniture_residual
  group: flashsac_pd

task:
  cfg:
    scene:
      num_envs: 16
    rewards:
      step:
        weight: 0.0
      corner_done:
        weight: 1.0
      grasp_done:
        weight: 1.0
      insert_done:
        weight: 1.0

trainer:
  learner: sac
  total_timesteps: 250000
  checkpoint_interval: 3125

residual:
  enabled: true

model:
  architecture: flashsac
  actor:
    hidden_size: 128
    num_blocks: 2
    expansion: 4
    min_log_std: -10.0
    max_log_std: 2.0
    # a near-zero residual at the start (Policy Decorator's 0.01 output init): FlashSAC's weight normalization
    # would make the mean head's rows unit length (means ~ +-0.7, ~11 mm of correction before any learning), so
    # this one head starts at gain 0.01 and stays out of it
    mean_init_scale: 0.01
    # the (state-dependent) std starts at FlashSAC's entropy target, 0.15 in every state, and learns per state from
    # there: the residual starts as ~1.5 mm of zero-mean noise per unit, not FlashSAC's initial ~0.02-1.8
    init_std: 0.15
  critic:
    hidden_size: 256
    num_blocks: 2
    expansion: 4

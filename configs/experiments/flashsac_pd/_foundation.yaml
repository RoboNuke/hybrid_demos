# flashsac_pd (the leading _ keeps launch_train from submitting this file on its own): B (policy_dec_sac_replica's
# residual: the frozen base physic_aligned_evalHappy_a0, 4-step chunks, the target-frame residual of 0.01 m / 0.01
# rad / 0.1 gripper per unit, the base chunk and the critics' executed chunk in the EE-relative command form, the
# critics on the observation alone, progressive exploration over 50k chunk steps) trained with every piece of
# FlashSAC (arXiv:2604.04539, Table 9 and its IsaacLab run script) except the env count (16, not 1024) and its mixed
# precision (never): its BatchNorm inverted-residual network, a categorical critic (101 bins on [-5, 5]) with
# adaptive reward scaling, weight normalization, the unified entropy target (sigma 0.15, temperature 0.01),
# cross-batch value prediction, noise repetition (Zeta s = 2, at most 16), 2 critics, tau 0.01, an actor update
# every 2 critic updates, batch 2048, 2 updates per env step, cosine LR 3e-4 -> 1.5e-4, gamma 0.99 with 3-step
# returns (IsaacLab's), learning after 500 env steps (B's; FlashSAC's 100k transitions are ~100 steps at 1024 envs), no
# gradient clipping, no observation normalizer.
base: ../policy_dec_sac_replica/_foundation.yaml

sac:
  discount_factor: 0.99
  n_step: 3
  polyak: 0.01
  batch_size: 2048
  # 2 updates per vectorized env step (FlashSAC's updates_per_interaction_step: 2)
  gradient_steps: 2
  update_every: 1
  policy_delay: 2
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  entropy_lr: 3.0e-4
  lr_schedule: cosine
  lr_end: 1.5e-4
  learn_entropy: true
  initial_entropy_value: 0.01
  target_entropy: null
  target_entropy_sigma: 0.15
  entropy_loss_form: alpha
  backup_entropy: true
  entropy_observations: current
  num_critics: 2
  critic_subset: 2
  actor_q_reduction: min
  # FlashSAC learns after 100k transitions, ~100 vector steps at its 1024 envs; at 16 envs that would be 6250
  # steps with an untrained actor while the exploration ramp rises, so learning starts at B's 500 (8000
  # transitions). No uniform warm-up: the actor acts from its own near-zero start
  random_timesteps: 0
  learning_starts: 500
  grad_norm_clip: 0.0
  normalize_observations: false
  critic_distribution: categorical
  critic_num_bins: 101
  critic_min_value: -5.0
  critic_max_value: 5.0
  adaptive_reward_scaling: true
  adaptive_reward_g_max: 5.0
  weight_normalization: true
  cross_batch_value: true
  noise_repeat: true
  noise_repeat_zeta_s: 2.0
  noise_repeat_max: 16
  # FlashSAC's actor is tanh-squashed
  unsquashed_actor: false

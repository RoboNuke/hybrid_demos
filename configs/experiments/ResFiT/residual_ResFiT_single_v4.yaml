# residual_ResFiT_single_v3.yaml (one residual over the whole task, the 50-demo base, the residual's demos from all 300,
# ResFiT's standardized inputs) with ResFiT's action sizing in place of the target frame's fixed per-axis scales:
# action_frame: absolute, scale = 1.1 x max(demo half range, 0.05) per dim, the executed action clamped at 1.1 x, the
# gripper corrected too. The actor's reach and the exploration std (ddpg.actor_action_scale, ddpg.exploration_std) are
# set from the demos' corrections (a_demo - a_base) in these units.
#   python scripts/make_phase_demos.py --config configs/experiments/ResFiT/residual_ResFiT_single_v4.yaml --dataset data/physic_aligned_tcp_300
#   python scripts/train.py --config configs/experiments/ResFiT/residual_ResFiT_single_v4.yaml --headless
base: _foundation.yaml

wandb:
  group: ResFiT_single_v4

task:
  cfg:
    scene:
      num_envs: 1
    # the env's phase rewards: 1 on the step the episode gets past each of corner, grasp and insert (once per
    # episode); assembling pays 1 (rewards.assembled, its default)
    rewards:
      corner_done:
        weight: 1.0
      grasp_done:
        weight: 1.0
      insert_done:
        weight: 1.0

trainer:
  learner: ddpg
  total_timesteps: 300000
  checkpoint_interval: 10000
  # publish every 1000 env steps; episode/success the mean of the last 10 episodes, each phase's success rate
  # (phase/passed_*, counted only for the episodes that reached the phase) the mean of the last 10 that reached it
  write_interval: 1000
  success_window: 10
  windowed_metrics:
    - phase/passed_*

residual:
  enabled: true
  base_run: runs/hybrid_demo_furniture/obs-fix_true-jacobian_50demos/obs-fix_true-jacobian_50demos_a0
  base_project: null
  base_run_name: null
  # ResFiT's action sizing: the executed action is the base's plus scale x r per dim, scale = 1.1 x max(the demos' half
  # range, 0.05) (their ActionScaler: (1 + action_scale) x max(half range, min_action_range / 2), action_scale 0.1),
  # every dim (position, rot6d, gripper), no accumulation, the executed action clamped to center +- 1.1 x half range
  action_frame: absolute
  action_scale: null
  action_scale_fraction: 1.1
  action_half_range_floor: 0.05
  executed_clip: 1.1
  residual_gripper: true
  # the foundation's target-frame fields back to their defaults (the absolute frame has none)
  target_axes: target
  target_rotation: rotvec
  target_scale_from_base: false
  target_pos_scale: null
  target_rot_scale_deg: null
  target_accumulate: false
  # ResFiT's StateStandardizer for the residual's observation inputs (v3's), the foundation's min-max floors off
  observation_normalization: standardize
  observation_std_floor: 0.1
  observation_floors:
    pos: null
    rot6d: null
    lin_vel: null
    ang_vel: null
    finger_width: null

ddpg:
  # the actor's reach 0.1 r (covers the demos' 95th-percentile corrections, 0.06-0.13 r); exploration N(0, 0.0025) r,
  # about 1/4 of a typical demo correction (median |a_demo - a_base| 0.005 r in x, y: 0.7 mm of noise per step), and
  # the uniform warm-up actions the same size (0.2 would be +-57 mm per step in x)
  actor_action_scale: 0.1
  exploration_std: 0.0025
  random_action_scale: 0.0025
  # one residual for the whole task: no routing (the foundation's route_labels), every env step its own
  route_labels: []
  route_clock: false
  # this base's demo residuals in this action meaning, one file of every demo frame, rewarded as the env is
  demo_transitions: data/ResFiT_single_v4/demos.pt
  # the replay memory beside every numbered checkpoint (memory_<step>.pt), for diagnostics
  save_memory_with_checkpoints: true

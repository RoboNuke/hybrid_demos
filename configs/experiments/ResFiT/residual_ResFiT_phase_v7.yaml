# one residual per phase (insert, screw) on the 50-demo base, one unit of r its phase's median demo correction per dim
# (additive_residual.phase_stats); the base policy + dropped columns (legs 2-4, the obstacle) + the additive residual,
# Coffee v2's learning settings, inputs standardized on the demo rows, timeouts terminal, no clamp of the sent action,
# per-phase logging. The demos: scaled_ablation's raw episodes (the same base and base settings), converted at load.
#   python scripts/make_raw_demos.py --config configs/experiments/ResFiT/residual_ResFiT_phase_v7.yaml --out data/scaled_ablation/raw_demos.pt
#   python scripts/train.py --config configs/experiments/ResFiT/residual_ResFiT_phase_v7.yaml --headless
#   python scripts/watch_residual_eval.py --headless --run runs/hybrid_demo_furniture_residual/ResFiT_phase_v7/ResFiT_phase_v7_a0 \
#     --eval_config configs/eval/residual_watch_furniture.yaml
base: _foundation.yaml

wandb:
  group: ResFiT_phase_v7

task:
  cfg:
    scene:
      num_envs: 1
    # the env's phase rewards: 1 on the step the episode gets past each of corner, grasp and insert (once per
    # episode); assembling pays 1 (rewards.assembled, its default)
    rewards:
      corner_done:
        weight: 1.0
      grasp_done:
        weight: 1.0
      insert_done:
        weight: 1.0

trainer:
  learner: ddpg
  total_timesteps: 750000
  checkpoint_interval: 10000
  # publish every 1000 env steps; episode/success the mean of the last 10 episodes, each phase's success rate
  # (phase/passed_*, counted only for the episodes that reached the phase) the mean of the last 10 that reached it
  write_interval: 1000
  success_window: 10

base_policy:
  enabled: true
  base_run: runs/hybrid_demo_furniture/obs-fix_true-jacobian_50demos/obs-fix_true-jacobian_50demos_a0
  base_project: null
  base_run_name: null
drop_columns:
  enabled: true
additive_residual:
  enabled: true
  # each routed phase's own scale, its median demo correction per dim (the file's scale; a phase without a residual 0)
  phase_stats: data/ResFiT_phase_v7/phase_stats.pt
  half_range_floor: null
  clip: null

ddpg:
  # timeouts end the target as a termination does (ResFiT's done = terminated | truncated; Coffee v2's)
  bootstrap_time_limits: false
  # one residual per phase, insert and screw (the foundation's route_labels), each counting its own steps (route_clock):
  # its 10k learning start and 10k critic warm-up in its phase's steps; corner and grasp run on the base alone
  route_labels:
    - insert
    - screw
  route_clock: true
  # r is in multiples of the phase's median demo correction on every dim (additive_residual.phase_stats). The reach 5
  # covers 80-98% of insert's corrections per dim and 83-97% of screw's; exploration N(0, 0.4): a typical draw 0.27x the
  # median correction; the warm-up uniform +-0.8 of it
  action_range:
    - -5.0
    - 5.0
  # r unclamped (it was clamped at +-6, the reach plus 3 noise std, before the clamp became the range's own), the target
  # policy's smoothing noise clipped at 2.4 (ResFiT's 6 x its std)
  clip_actions: false
  # the base's raw demo episodes (scripts/make_raw_demos.py), each routed residual loading its own phase's steps
  demo_transitions: data/scaled_ablation/raw_demos.pt
  # the inputs standardized on the demo rows (theirs: the demos' mean and std)
  state_preprocessor: demo
  save_memory_with_checkpoints: true
  # per-phase logging: <phase>_episode/*, <phase>_q/*, ... against <phase>_step for insert and screw; corner and grasp
  # in episode/
  phase_logging: true
  phase_logging_phases:
    - corner
    - grasp
    - insert
    - screw
  warmup_noise:
    scale: 0.8
    target_scale: 0.4
    target_clip: 2.4
  train_noise:
    scale: 0.4
    target_clip: 2.4

# one residual per phase (insert, screw) on the 50-demo base, each with its own action scale and observation
# standardization from its own demo frames, one unit of r its phase's median demo correction (residual.phase_scales,
# action_scale_source: median_correction); otherwise residual_ResFiT_single_v6.yaml's (Coffee v2's learning settings,
# standardized inputs, the absolute frame, timeouts terminal, no clamp of the executed action), with per-phase logging.
#   python scripts/make_phase_demos.py --config configs/experiments/ResFiT/residual_ResFiT_phase_v7.yaml --dataset data/physic_aligned_tcp_300
#   python scripts/train.py --config configs/experiments/ResFiT/residual_ResFiT_phase_v7.yaml --headless
#   python scripts/watch_residual_eval.py --headless --run runs/hybrid_demo_furniture_residual/ResFiT_phase_v7/ResFiT_phase_v7_a0 \
#     --eval_config configs/eval/residual_watch_furniture.yaml
base: _foundation.yaml

wandb:
  group: ResFiT_phase_v7

task:
  cfg:
    scene:
      num_envs: 1
    # the env's phase rewards: 1 on the step the episode gets past each of corner, grasp and insert (once per
    # episode); assembling pays 1 (rewards.assembled, its default)
    rewards:
      corner_done:
        weight: 1.0
      grasp_done:
        weight: 1.0
      insert_done:
        weight: 1.0

trainer:
  learner: ddpg
  total_timesteps: 750000
  checkpoint_interval: 10000
  # publish every 1000 env steps; episode/success the mean of the last 10 episodes, each phase's success rate
  # (phase/passed_*, counted only for the episodes that reached the phase) the mean of the last 10 that reached it
  write_interval: 1000
  success_window: 10

residual:
  enabled: true
  base_run: runs/hybrid_demo_furniture/obs-fix_true-jacobian_50demos/obs-fix_true-jacobian_50demos_a0
  base_project: null
  base_run_name: null
  # the executed action is the base's plus scale x r per dim, no accumulation, no clamp; the scale and the observation
  # standardization per routed phase (insert, screw), from that phase's demo frames: one unit of r is the phase's median
  # demo correction |a_demo - a_base| on each dim (0 where the demos never correct it: the gripper)
  action_frame: absolute
  action_scale: null
  executed_clip: null
  phase_scales: true
  phase_stats: data/ResFiT_phase_v7/phase_stats.pt
  action_scale_source: median_correction
  residual_gripper: true
  # the foundation's target-frame fields back to their defaults (the absolute frame has none)
  target_axes: target
  target_rotation: rotvec
  target_scale_from_base: false
  target_pos_scale: null
  target_rot_scale_deg: null
  target_accumulate: false
  # ResFiT's StateStandardizer for the residual's observation inputs (v3's), the foundation's min-max floors off
  observation_normalization: standardize
  observation_std_floor: 0.1
  observation_floors:
    pos: null
    rot6d: null
    lin_vel: null
    ang_vel: null
    finger_width: null

ddpg:
  # timeouts end the target as a termination does (ResFiT's done = terminated | truncated; Coffee v2's)
  bootstrap_time_limits: false
  # one residual per phase, insert and screw (the foundation's route_labels), each counting its own steps (route_clock):
  # its 10k learning start and 10k critic warm-up in its phase's steps; corner and grasp run on the base alone
  route_labels:
    - insert
    - screw
  route_clock: true
  # r is in multiples of the phase's median demo correction on every dim (residual.action_scale_source). The reach 5
  # covers 80-98% of insert's corrections per dim and 83-97% of screw's; exploration N(0, 0.4): a typical draw 0.27x the
  # median correction; the warm-up uniform +-0.8 of it
  actor_action_scale: 5.0
  exploration_std: 0.4
  random_action_scale: 0.8
  # every r clamped to +-6 (the reach plus 3 noise std; the default 1 would cut the reach to 1), the target policy's
  # smoothing noise clipped at 2.4 (ResFiT's 6 x its std)
  action_clip: 6.0
  target_noise_clip: 2.4
  # each phase's demo residuals, in its own phase's units (scripts/make_phase_demos.py)
  demo_transitions: data/ResFiT_phase_v7/demos_{route}.pt
  save_memory_with_checkpoints: true
  # per-phase logging: <phase>_episode/*, <phase>_q/*, ... against <phase>_step for insert and screw; corner and grasp
  # in episode/
  phase_logging: true
  phase_logging_phases:
    - corner
    - grasp
    - insert
    - screw

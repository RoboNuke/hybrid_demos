# residual_ResFiT_single_v4.yaml (ResFiT's absolute action sizing, standardized inputs, exploration and warm-up 0.0025 r)
# with the actor's reach also 0.0025 r (v4: 0.1), and nothing else changed (the same demo transitions: the reach is not in
# them).
#   python scripts/train.py --config configs/experiments/ResFiT/residual_ResFiT_single_v5.yaml --headless
#   python scripts/watch_residual_eval.py --headless --run runs/hybrid_demo_furniture_residual/ResFiT_single_v5/ResFiT_single_v5_a0 \
#     --eval_config configs/eval/residual_watch_furniture.yaml
base: _foundation.yaml

wandb:
  group: ResFiT_single_v5

task:
  cfg:
    scene:
      num_envs: 1
    # the env's phase rewards: 1 on the step the episode gets past each of corner, grasp and insert (once per
    # episode); assembling pays 1 (rewards.assembled, its default)
    rewards:
      corner_done:
        weight: 1.0
      grasp_done:
        weight: 1.0
      insert_done:
        weight: 1.0

trainer:
  learner: ddpg
  total_timesteps: 300000
  checkpoint_interval: 10000
  # publish every 1000 env steps; episode/success the mean of the last 10 episodes, each phase's success rate
  # (phase/passed_*, counted only for the episodes that reached the phase) the mean of the last 10 that reached it
  write_interval: 1000
  success_window: 10
  windowed_metrics:
    - phase/passed_*

residual:
  enabled: true
  base_run: runs/hybrid_demo_furniture/obs-fix_true-jacobian_50demos/obs-fix_true-jacobian_50demos_a0
  base_project: null
  base_run_name: null
  action_scale: null
  action_scale_fraction: 1.1
  action_half_range_floor: 0.05
  executed_clip: 1.1

ddpg:
  # the actor's reach, the exploration and the uniform warm-up actions all 0.0025 r: about 1/4 of a typical demo correction
  # (median |a_demo - a_base| 0.005 r in x, y), at most 0.7 mm per step in x, y and 0.55 mm in z (v4's 0.1 reach let the
  # actor drift 17-20 mm per step, uncorrelated with the demo corrections, and success stayed 0 from 20k to 300k)
  action_range:
    - -0.0025
    - 0.0025
  exploration_std: 0.0025
  random_action_scale: 0.0025
  # one residual for the whole task: no routing (the foundation's route_labels), every env step its own
  route_labels: []
  route_clock: false
  # this base's demo residuals in this action meaning, one file of every demo frame, rewarded as the env is
  demo_transitions: data/ResFiT_single_v4/demos.pt
  # the replay memory beside every numbered checkpoint (memory_<step>.pt), for diagnostics
  save_memory_with_checkpoints: true

# ResFiT (the leading _ keeps launch_train from submitting this file on its own): Ankile et al. 2025,
# arXiv:2509.19301, "Residual Off-Policy RL for Finetuning Behavior Cloning Policies", on one_leg with our frozen base
# physic_aligned_evalHappy_a0. The method is configs/methods/resfit.yaml, unchanged (its residual, learner, memory and
# networks); this file adds one_leg (configs/base/fb_one_leg.yaml: the task, its 10 Hz timing and its episodes) and
# the values one_leg needs on top.
#
# The residual is ResFiT's arithmetic on our action: the base's absolute target [pos 3, rot6d 6, gripper 1] plus
# 1.1 x max(demo half range, 0.05) x r per dim, clamped to the widened range (action_space: per_dim). The rot6d numbers
# are added as numbers, as ResFiT adds to whatever its env's action holds; the env turns them back into a rotation.
#
# one_leg runs one residual per bottleneck phase (ddpg.route_labels: insert, screw), each with its own actor, critics,
# optimizers, replay memory and clock (route_clock): each counts its learning start, critic warm-up and updates in its
# own phase's steps, so the screw residual starts when screw has given it 10k rows, not after 10k env steps. Each is
# rewarded sparsely and locally: 1 when its phase is passed (insert: the leg held inserted for 5 steps,
# furniture.phase_hold_steps; screw: assembled), its attempt then over.
#
# Not ResFiT's (our setup has no equivalent, or none is possible here):
#  * the input normalization is the model's (ddpg.state_preprocessor, the learner's default: none); theirs standardizes
#    with the demos' mean and std, the std floored at 0.1;
#  * the base plans every chunk cold (residual.base_warm_start: false): the per-phase demos measure each demo
#    residual against a cold base plan, so the env's base must plan the same way;
#  * their critics share one encoder; ours are separate MLPs (the same widths);
#  * images: their tasks are image-based, ours is state-based.
base:
  - ../../base/fb_one_leg.yaml
  - ../../methods/resfit.yaml
experiment:
  seed: 42
wandb:
  entity: hur
  project: hybrid_demo_furniture_residual
trainer:
  best_by: success
task:
  cfg:
    furniture:
      # insert counts as passed after the leg has stayed inserted for 5 steps
      phase_hold_steps: 5
      # no no-progress reset (0 is off): every episode runs to its time limit. Ending a stuck attempt early cut the
      # steps the later phase's residual gets, and the per-phase residuals are already short of data
      stall_steps_insert: 0
      stall_steps_screw: 0
residual:
  base_project: hybrid_demo_furniture
  base_run_name: physic_aligned_evalHappy_a0
  base_warm_start: false
  # legs 1-3 (never touched in one_leg) and the front obstacle (fixed on every reset)
  observation_drop:
    - - 25
      - 52
    - - 61
      - 63
ddpg:
  # the Coffee / CanSorting paper runs' (the code's defaults: 0.99, 3-step), exploration N(0, 0.025)
  discount_factor: 0.995
  n_step: 5
  exploration_std: 0.025
  # half of every batch from the phase's demos (scripts/make_phase_demos.py), the actor on the same batch
  demo_transitions: data/ResFiT/demos_{route}.pt
  demo_storage: sample
  demo_sampling_start: 0
  demo_sampling_end: 1000000000
  demo_batch_shared: true
  # one residual per phase, each counting its own steps
  route_labels:
    - insert
    - screw
  route_clock: true
  std_by_label: eval_state/phase/id
  std_label_names:
    - corner
    - grasp
    - insert
    - screw
    - success
  metrics_by_label:
    - residual/position_mm
    - residual/rot_deg
  cuda_graph: true
# 300k transitions per residual (the Coffee / CanSorting paper runs'; the code's default 200k)
memory:
  memory_size: 300000

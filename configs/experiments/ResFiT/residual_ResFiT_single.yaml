# residual_ResFiT_obsfix_50demos_delta.yaml (the delta-pose residual, ResFiT's exploration, the 50-demo base, the residual's
# demo buffer from all 300 demos) as ONE residual over the whole task instead of one per phase, and nothing else changed:
#  1. a single DDPG learner (ddpg.route_labels: [], route_clock off): it acts in every phase and learns from every env
#     step, so no phase waits on another for data (the per-phase screw residual starved while insert was down);
#  2. no dense shaping (no ddpg.potential_terms): the env's own sparse reward, its phase rewards on (1 on the step the
#     episode gets past corner, grasp and insert: task.cfg.rewards.*_done) plus 1 for assembling (assembled, default);
#  3. the stall reset is off (the foundation's, since 2026-11-03), and the memory is saved beside each checkpoint.
# The networks stay the foundation's (actor 2 x 1024, 1.11M parameters; 10 critics of 2 x 1024, 1.10M each): already
# ~3.6x resip_ppo_replica's 512 x 2 actor (0.31M) and value net (0.30M).
#   python scripts/make_phase_demos.py --config configs/experiments/ResFiT/residual_ResFiT_single.yaml --dataset data/physic_aligned_tcp_300
#   python scripts/train.py --config configs/experiments/ResFiT/residual_ResFiT_single.yaml --headless
#   python scripts/watch_residual_eval.py --run runs/hybrid_demo_furniture_residual/ResFiT_single/ResFiT_single_a0 \
#     --eval_config configs/eval/residual_watch_furniture.yaml
base: _foundation.yaml

wandb:
  group: ResFiT_single

task:
  cfg:
    scene:
      num_envs: 1
    # the env's phase rewards: 1 on the step the episode gets past each of corner, grasp and insert (once per
    # episode); assembling pays 1 (rewards.assembled, its default)
    rewards:
      corner_done:
        weight: 1.0
      grasp_done:
        weight: 1.0
      insert_done:
        weight: 1.0

trainer:
  learner: ddpg
  total_timesteps: 300000
  checkpoint_interval: 10000
  # publish every 1000 env steps; episode/success the mean of the last 10 episodes, each phase's success rate
  # (phase/passed_*, counted only for the episodes that reached the phase) the mean of the last 10 that reached it
  write_interval: 1000
  success_window: 10
  windowed_metrics:
    - phase/passed_*

residual:
  enabled: true
  # the 50-demo obs-fix_true-jacobian base, as a local run directory (its resolved config one level up)
  base_run: runs/hybrid_demo_furniture/obs-fix_true-jacobian_50demos/obs-fix_true-jacobian_50demos_a0
  base_project: null
  base_run_name: null
  # r = 1: the demos' 99th-percentile per-step move from the EE to its target, per axis, in the robot-base frame
  target_scale_from_base: false
  target_pos_scale:
    - 0.019
    - 0.015
    - 0.021
  target_rot_scale_deg:
    - 8.9
    - 10.9
    - 21.7
  # a delta-pose residual: r adds to an offset on the base's targets, reset when the base replans
  target_accumulate: true
  # the pose alone (6 per step): the gripper stays the base's
  residual_gripper: false

ddpg:
  # ResFiT's Coffee / CanSorting runs: the actor's reach +-0.2 r, exploration N(0, 0.025) r, and until each phase has
  # its 10k rows (learning_starts_rows) the base plus uniform +-0.2 r, those rows kept in the buffer
  actor_action_scale: 0.2
  exploration_std: 0.025
  random_action_scale: 0.2
  # one residual for the whole task: no routing (the foundation's route_labels), every env step its own
  route_labels: []
  route_clock: false
  # this base's demo residuals in this action meaning, one file of every demo frame, rewarded as the env is
  demo_transitions: data/ResFiT_single/demos.pt
  # the replay memory beside every numbered checkpoint (memory_<step>.pt), for diagnostics
  save_memory_with_checkpoints: true

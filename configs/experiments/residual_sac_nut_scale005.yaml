# residual_sac_nut with the residual bounded at 5% of the base's normalized action range
# instead of 10% (~1 mm in x / y, ~1.4 mm in z, ~5 deg in yaw per step), the only change. Its
# demo transitions are divided by the scale, so it has its own file.
#
#   python scripts/make_demo_transitions.py --config configs/experiments/residual_sac_nut_scale005.yaml
#   python scripts/train.py --config configs/experiments/residual_sac_nut_scale005.yaml --headless
#   python scripts/watch_residual_eval.py --run runs/hybrid_demo_nut/residual_sac_nut_scale005/residual_sac_nut_scale005_a0 \
#       --eval_config configs/eval/residual_watch_nut.yaml --headless
base: residual_sac_nut.yaml

wandb:
  group: residual_sac_nut_scale005

residual:
  action_scale_fraction: 0.05

sac:
  demo_transitions: data/forge_v1_nut_bolt_relative/transitions/residual_sac_nut_scale005.pt

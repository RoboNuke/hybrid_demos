# Residual SAC on the frozen physic_aligned_evalHappy_a0 diffusion policy (wandb hur/hybrid_demo_furniture),
# in that run's env: the residual_sac_furniture_resip recipe (10 critics, target min over a random 2, 10
# critic updates per env step, the actor once per env step on the ensemble mean, one env, an 8-step history
# of the EE position and velocity, the critic warmed up on the demos), its step counts set for this env's
# 1000-step episodes. The residual is bounded at 2% of the base's normalized action range per dim, over all
# 10 absolute action dims (goal position 3, goal rot6d 6, gripper).
#
# The env is exactly the base's: physic_aligned.yaml's task (furniture_resip.yaml's
# Isaac-Furniture-OneLeg-FBAbs-ResiP-v0, 100 s episodes, the top's SDF at 1024) plus the four settings
# physic_aligned_evalHappy_a0 was launched with on the command line (position gripper, self-collisions on,
# 0.2 m/s finger cap, Isaac Lab's IK Jacobian) -- only the env count differs
# (tests/residual/test_experiment_configs.py pins it).
#
# The base comes from wandb (residual.base_project / base_run_name): its best checkpoint, downloaded fresh
# when the env is built; the log line "[residual] base ..." names the step it got. This run logs to its own
# project, hybrid_demo_furniture_residual (runs/hybrid_demo_furniture_residual/residual_sac_physic_aligned/).
#
# Convert the base's demos (its bc.dataset, data/physic_aligned) into this run's transition format, then train:
#   python scripts/make_demo_transitions.py --config configs/experiments/residual_sac_physic_aligned.yaml
#   python scripts/train.py --config configs/experiments/residual_sac_physic_aligned.yaml --headless
base: ../base/furniture_resip.yaml

experiment:
  num_agents: 1
  seed: 42

wandb:
  project: hybrid_demo_furniture_residual
  group: residual_sac_physic_aligned

task:
  cfg:
    # the base's 1000-step episodes at 10 Hz (physic_aligned.yaml)
    episode_length_s: 100.0
    scene:
      num_envs: 1
    furniture:
      # FurnitureBench's meshes with the top's SDF at 1024 (physic_aligned.yaml)
      part_assets: furniturebench_top1024
      # what physic_aligned_evalHappy_a0 was launched with on the command line
      gripper_mode: position
      robot_self_collisions: true
      gripper_velocity_limit: 0.2
      ik_jacobian: isaaclab

trainer:
  learner: sac
  # 12 h of robot time: 43200 s at 10 Hz, 432 whole 1000-step episodes
  total_timesteps: 432000
  # every 10 episodes, log and checkpoint together
  write_interval: 10000
  checkpoint_interval: 10000
  log_memory_stats: false

memory:
  # the newest 100k transitions (100 episodes); older data is dropped
  memory_size: 100000

sac:
  batch_size: 256
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  entropy_lr: 3.0e-4
  initial_entropy_value: 1.0e-2
  # well below -|A| / 2 (-5): SAC at -5 explored near the full bound
  target_entropy: -15.0
  cuda_graph: true
  num_critics: 10
  critic_subset: 2
  actor_q_reduction: mean
  gradient_steps: 10
  policy_delay: 10
  learning_starts: 0
  # 2 episodes of critic-only warm-up
  policy_learning_starts: 2000
  demo_transitions: data/physic_aligned/transitions/residual_sac_physic_aligned.pt
  demo_sampling_start: 0
  # demos sampled for the first 10 episodes
  demo_sampling_end: 10000

model:
  actor:
    last_layer_scale: 0.1

residual:
  enabled: true
  # the base BC run on wandb (under wandb.entity, hur): another project than this run's
  base_project: hybrid_demo_furniture
  base_run_name: physic_aligned_evalHappy_a0
  base_checkpoint: actor_chkpt_best_success_rate.pt
  action_scale: null
  action_scale_fraction: 0.02

history:
  enabled: true
  length: 8
  terms:
    - ee_pos
    - ee_pos_vel

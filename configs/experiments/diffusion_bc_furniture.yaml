# Diffusion-policy behaviour cloning on the scripted-servo FurnitureBench one_leg demos, in
# FurnitureBench's own interface (49-d state, 8-d action): the peg-insert recipe
# (diffusion_bc.yaml, robust-rearrangement's state diffusion transformer: 1000 steps per epoch,
# batch 256) with checkpoints every 100 epochs. Rollouts run in the env the demos were collected
# in (configs/base/furniture_fixed_dyn.yaml: 0.5 / 0.4 friction, the 600 N/m finger drive).
#
#   python scripts/import_furniture_demos.py --src ~/Robonuke_Furniture_Bench/demos --out data/furniture_one_leg
#   python scripts/train_bc.py --config configs/experiments/diffusion_bc_furniture.yaml --headless
base: ../base/furniture_fixed_dyn.yaml

experiment:
  seed: 42

wandb:
  group: diffusion_bc_furniture

task:
  cfg:
    scene:
      # rollout envs: one round of eval.num_rollouts episodes (the scene has 5 parts, a 64-env
      # rollout is heavier than Forge's; drop both to 32 if the GPU runs out)
      num_envs: 64

trainer:
  learner: diffusion_bc
  # gradient steps (1000 epochs x bc.steps_per_epoch)
  total_timesteps: 1000000
  checkpoint_interval: 100000

model:
  architecture: diffusion_transformer
  actor:
    # every chunk from pure noise, as in training
    warm_start: false

bc:
  # relative to the project root, where the scripts run from (the importer's output)
  dataset: data/furniture_one_leg
  obs_key: observation.state
  action_key: action
  # all 50 demos: 3 (ceil(0.05 x 50)) are held out for the test loss, 47 train
  num_demos: 50
  # roll out every 10 epochs whatever the test loss
  rollout_loss_threshold: 1000.0
  # the sampled-action error breakdown follows the family: pos [0..2], rot [3..6], gripper [7]

eval:
  num_rollouts: 64

# policy_dec_replica (the leading _ keeps launch_train from submitting this file on its own):
# resip_replica's diffusion-policy BC on one_leg with the action relative to the end-effector
# (base/fb_one_leg_delta.yaml), as Policy Decorator's base acts. What its trainings share: the env,
# the seed, the wandb entity and the BC parameters -- resip_replica/_foundation.yaml's bc and eval
# sections unchanged, but for the action column (action.delta) of the same 50 demos and the action
# used as it is.
base: ../../base/fb_one_leg_delta.yaml

experiment:
  seed: 42

wandb:
  entity: hur

# -- BC (scripts/train_bc.py): ResiP's released one_leg recipe (robust-rearrangement's checkpoint config)
bc:
  # data/physic_aligned's 50 demos (the same episodes, in order), with the delta action column:
  #   python scripts/import_furniture_demos.py --src ~/Robonuke_Furniture_Bench/datasets/physic_aligned \
  #       --out data/physic_aligned_delta --control_hz 10 --task_name Isaac-Furniture-OneLeg-FBDelta-ResiP-v0 \
  #       --max_demos 50
  dataset: data/physic_aligned_delta
  obs_key: observation.state_abs
  action_key: action.delta
  num_demos: 50
  normalization: per_dim
  # the delta action is already in [-1, 1] (dpos in units of 0.12 m, drot an axis-angle in rad):
  # used as it is, so a zero output holds the EE
  normalize_action: false
  batch_size: 1024
  steps_per_epoch: 1000
  lr: 1.0e-4
  weight_decay: 1.0e-6
  lr_schedule: cosine
  warmup_steps: 2000
  # rollouts every 10 epochs (10k gradient steps), whatever the test loss (ResiP waits for 0.1)
  rollout_every: 10
  rollout_loss_threshold: 1000.0
  # only the best rollout's checkpoint, on disk and in wandb (~800 MB each)
  save_only_best_ckpt: true

eval:
  # BC rollouts per evaluation
  num_rollouts: 512

# Diffusion-policy BC on the one_leg demos in ResiP's interface: absolute EE targets with
# rot6d orientations (action 10) and rot6d orientations in the observation (61),
# Isaac-Furniture-OneLeg-FBAbs-v0. The transformer recipe of diffusion_bc_furniture with
# ResiP's training settings: weight decay 1e-6, 5000 epochs x 1000 steps, rollouts of 128
# episodes every 10 epochs, best checkpoint by rollout success.
#
#   python scripts/import_furniture_demos.py --src ~/Robonuke_Furniture_Bench/demos --out data/furniture_one_leg_abs
#   python scripts/train_bc.py --config configs/experiments/diffusion_bc_furniture_abs.yaml --headless
base: ../base/furniture_fixed_dyn.yaml

experiment:
  seed: 42

wandb:
  group: diffusion_bc_furniture_abs

task:
  name: Isaac-Furniture-OneLeg-FBAbs-v0
  cfg:
    scene:
      # rollout envs: one round of eval.num_rollouts episodes (drop both to 64 if the GPU runs out)
      num_envs: 128

trainer:
  learner: diffusion_bc
  # gradient steps (5000 epochs x bc.steps_per_epoch)
  total_timesteps: 5000000
  checkpoint_interval: 500000

model:
  architecture: diffusion_transformer
  actor:
    warm_start: false

bc:
  dataset: data/furniture_one_leg_abs
  obs_key: observation.state_abs
  action_key: action.abs
  num_demos: 50
  weight_decay: 1.0e-6
  rollout_loss_threshold: 1000.0
  # the sampled-action error breakdown follows the task: pos [0..2], rot6d [3..8], gripper [9]

eval:
  num_rollouts: 128

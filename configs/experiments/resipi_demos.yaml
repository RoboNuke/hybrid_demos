# resipi_demos: deep_resipi_replica trained on ResiP's own 50 one_leg low teleop demos instead
# of our scripted ones -- the only change -- to tell whether our demos cap BC. The demos are
# ResiP's processed zarr; the importer scales back their shrunk rotation deltas, moves their
# EE / target z into this port's base frame and keeps the recorded front-obstacle position
# (the ResiP task observes it: 70 wide). Their demos were recorded in their sim, so they replay
# poorly open loop here; the policy is evaluated closed loop in this port's ResiP task.
#
#   aws s3 sync --no-sign-request \
#       s3://iai-robust-rearrangement/data/processed/diffik/sim/one_leg/teleop/low/ ~/resip_data/one_leg_teleop_low/
#   python scripts/import_resip_zarr.py --zarr ~/resip_data/one_leg_teleop_low/success.zarr --out data/resipi_demos
#   python scripts/train_bc.py --config configs/experiments/resipi_demos.yaml --headless
base: deep_resipi_replica.yaml

wandb:
  group: resipi_demos

bc:
  dataset: data/resipi_demos

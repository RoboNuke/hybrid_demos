# Conditions for scripts/watch_residual_eval.py on the nut-threading residual
# (residual_sac_nut.yaml), layered on the run's own config: 100 envs, one episode each per
# evaluation, the run's 30 s episodes, and the run's conditions otherwise (bolt clamped, its
# estimate 2 mm off, the nut's stock offset, observation noise as trained).
#
# No reset on success: the watcher runs all envs through one round together and counts success
# at any step, so the reset (one env only) is not needed and the force covers the full 30 s.
#
#   python scripts/watch_residual_eval.py --run runs/hybrid_demo_nut/residual_sac_nut/residual_sac_nut_a0 \
#       --eval_config configs/eval/residual_watch_nut.yaml --headless
eval:
  num_rollouts: 100

episode:
  reset_on_success: false

task:
  cfg:
    episode_length_s: 30.0
    scene:
      num_envs: 100

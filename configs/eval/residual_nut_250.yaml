# A larger one-off evaluation of a nut-threading residual (residual_sac_nut*.yaml) with
# scripts/watch_residual_eval.py --steps: 250 envs, one episode each, the run's 30 s episodes and
# conditions (bolt clamped, its estimate 2 mm off, the nut's stock offset). No reset on success
# (every env runs one round together; success counts at any step).
#
#   python scripts/watch_residual_eval.py --run runs/hybrid_demo_nut/residual_sac_nut_scale005/residual_sac_nut_scale005_a0 \
#       --eval_config configs/eval/residual_nut_250.yaml --steps <step> ... --out_name eval_250 --headless
eval:
  num_rollouts: 250

episode:
  reset_on_success: false

task:
  cfg:
    episode_length_s: 30.0
    scene:
      num_envs: 250

# 250 nut-threading episodes, one per env, with Forge's full observation noise (the stock
# obs_rand the run trained with: fingertip 0.25 mm / 0.1 deg, force 1 N, and the run's bolt
# estimate error). Everything else stays as the run trained.
#
#   python scripts/eval.py --local runs/hybrid_demo_nut/diffusion_bc_nut/diffusion_bc_nut_a0 \
#       --eval_config configs/eval/nut_250.yaml --checkpoint actor_chkpt_best_success_rate.pt --headless
eval:
  num_rollouts: 250

task:
  cfg:
    scene:
      num_envs: 250

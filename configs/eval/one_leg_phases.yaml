# Record a BC policy's one_leg rollouts for playback (furniture_record.yaml's 8 episodes on 4 envs,
# 480x360) with the task phases tracked and drawn: Robonuke_Furniture_Bench's
# furniture.track_phases (Corner -> Grasp -> Insert -> Screw, then success / failure / timeout)
# and the one_leg overlay (my_project/overlays.py: a box per phase reached with its tests as
# measurement/goal, frozen once passed; the tracking error; the force bar; the phase timeline).
# The wrench estimate goes into the per-step parquet
# (furniture.log_wrench: eval_state/ee_wrench_0..5), and the policy's chunk is drawn as spheres
# (bc.show_waypoints, 5 mm so they show at this resolution).
#   python scripts/eval.py --run <entity>/<project>/<run> --eval_config configs/eval/one_leg_phases.yaml --headless
# (everything lands in the run's local videos/one_leg_phases_<timestamp>/, beside its checkpoints/)
# The phase thresholds are furniture.phase_*; tune one on the command line, e.g.
#   task.cfg.furniture.phase_lift=0.02
base: furniture_record.yaml

eval:
  overlays:
    - hud
    - one_leg

task:
  cfg:
    furniture:
      track_phases: true
      log_wrench: true

bc:
  show_waypoints: true
  waypoint_radius: 0.005

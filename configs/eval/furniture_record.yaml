# Record a BC policy's one_leg rollouts: 8 episodes on 4 envs, one mp4 per (round, env)
# under the run's eval/ directory. The recorder camera needs real per-env prims
# (clone_in_fabric: false).
#   python scripts/eval.py --local runs/hybrid_demo_furniture/diffusion_bc_furniture/diffusion_bc_furniture_a0 \
#       --eval_config configs/eval/furniture_record.yaml --checkpoint actor_chkpt_last.pt --headless
base: ../base/hpc.yaml

eval:
  num_rollouts: 8
  record: true
  # twice the package's 240x180
  video_width: 480
  video_height: 360
  # every video is the full 600 steps, the end held with its cause (the package default),
  # at the control rate (video_fps null, the default): real time

task:
  cfg:
    scene:
      num_envs: 4
      clone_in_fabric: false
      # the dark grey work table, also for runs trained before it was the default
      table:
        spawn:
          visual_material:
            diffuse_color: [0.08, 0.08, 0.08]

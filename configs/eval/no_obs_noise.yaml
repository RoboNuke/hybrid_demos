# Evaluate / watch with Forge's observation noise off: exact fingertip position, rotation and
# force, and an exact hole estimate (no per-episode offset). Everything else, including the
# peg's offset in the gripper, stays as the run trained.
#
#   python scripts/debug.py --local runs/hybrid_demo_pih/diffusion_bc/diffusion_bc_a0 \
#       --eval_config configs/eval/no_obs_noise.yaml --checkpoint actor_chkpt_best_success_rate.pt
eval:
  num_rollouts: 64

task:
  cfg:
    scene:
      num_envs: 64
    obs_rand:
      fingertip_pos: 0.0
      fingertip_rot_deg: 0.0
      ft_force: 0.0
      fixed_asset_pos: [0.0, 0.0, 0.0]
    viewer:
      # in front of the robot, looking back at the hole (the debug viewer's single env)
      eye: [1.25, 0.0, 0.45]
      lookat: [0.6, 0.0, 0.08]

bc:
  # draw the policy's 32-waypoint chunk: executing now purple, the rest of the 8 executed green,
  # the 24-step tail red
  show_waypoints: true

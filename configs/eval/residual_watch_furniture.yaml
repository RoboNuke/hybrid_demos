# Conditions for scripts/watch_residual_eval.py on a FurnitureBench residual run, layered on the
# run's own config: 100 envs, each env's first episode of a round counts, the run's own episode
# length (70 s on the ResiP setup). No observation noise (the env has none); everything else
# stays as the run trained.
eval:
  num_rollouts: 100

task:
  cfg:
    scene:
      num_envs: 100

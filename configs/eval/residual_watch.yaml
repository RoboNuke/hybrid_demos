# Conditions for scripts/watch_residual_eval.py, layered on the residual run's own config:
# 100 envs, one episode each per evaluation, the run's 15 s episodes. Observation noise and
# everything else stay as the run trained.
eval:
  num_rollouts: 100

task:
  cfg:
    episode_length_s: 15.0
    scene:
      num_envs: 100

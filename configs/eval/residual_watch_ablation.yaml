# scripts/watch_residual_eval.py over a scaled_ablation run's group directory (its 5 agents side by side), layered
# on the run's own config: 1000 envs = 5 agents x 200, 200 episodes per agent in one round (each env's first
# episode counts), the run's own episode length. The no-progress resets
# (a training-only shortcut) are off, as in residual_watch_furniture.yaml. Everything else stays as the run trained.
#   python launchers/launch_watch.py configs/experiments/scaled_ablation/ --project one_leg_scaled_ablations \
#       --group_prefix abs --eval_config configs/eval/residual_watch_ablation.yaml
# hpc.yaml: the cluster's resources for launchers/launch_watch.py, which reads them from this chain. The watcher
# needs no cameras; 1000 one_leg envs plus the diffusion base want a large card, so only the 80 / 141 GB
# dgxh nodes are asked for, and the walltime stays under 16 h so a job submitted the day before
# a maintenance window (Slurm refuses a start that would cross one) still starts; a relaunch resumes from each
# agent's eval_watch/results.jsonl.
base: ../base/hpc.yaml

eval:
  num_rollouts: 200

task:
  cfg:
    scene:
      num_envs: 1000
    furniture:
      stall_steps_insert: 0
      stall_steps_screw: 0

hpc:
  partitions: dgxh
  constraint: vram80g|vram140g
  mem: 96G
  cpus: 8
  time: "16:00:00"
